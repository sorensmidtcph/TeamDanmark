<style>

:root{--ink:#111;--paper:#fff;--soft:#f2f2f0;--line:#c9c9c6;--muted:#656563;--pill:#dededb;--fill:#e8e8e8;--card-line:#e6e9ea;--sub:#7a7a7a;--body2:#3c3c3c;--bar:#f2f2f0f7;--font:"Inter",Arial,sans-serif;color-scheme:light}

}

/* Til atleten: sektionsforside fra Figma (02 Sektionsside) */
.ta{--tg:clamp(16px,2.78vw,40px)}
.ta button{text-align:left}
.ta-wrap{padding-inline:var(--tg)}
.ta-crumbs{padding:24px var(--tg) 0;margin-bottom:0}
.ta-h1{font-size:clamp(40px,5vw,72px);font-weight:600;line-height:1.1;max-width:860px;margin:48px 0 24px;text-wrap:balance}
.ta-ph{background:var(--fill)}
.ta-hero{aspect-ratio:1360/664;border-radius:32px;max-width:100%}
.ta-h56{font-size:clamp(30px,3.9vw,56px);font-weight:600;line-height:1.3;max-width:1250px}
.ta-h48{font-size:clamp(28px,3.35vw,48px);font-weight:600;line-height:1.2}
.ta-body{font-size:20px;font-weight:500;line-height:1.4}
.ta-intro{margin-top:48px}
.ta-introrow{grid-template-columns:minmax(0,553px) minmax(0,473px);align-items:center;gap:40px;margin:64px 0 0 13.2%;display:grid}
.ta-img{aspect-ratio:1;border-radius:16px}
.ta-introrow .ta-body{margin-top:8px}
.st-tools{margin-top:48px}
.st-tools .st-filters{margin-top:0}
.st-search{display:block;max-width:560px}
.st-search input{box-sizing:border-box;max-width:100%;width:100%;height:56px;border:1px solid #d4d4d4;border-radius:60px;padding:0 24px;font-size:17px;background:#fff}
.st-filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.st-chip{border:1px solid #d4d4d4;border-radius:60px;padding:7px 16px;font-size:15px;font-weight:500;line-height:22px;background:#fff}
.st-chip.is-on{background:#22282b;border-color:#22282b;color:#fff}
.ar{padding-inline:var(--tg)}
.ar-head{background:var(--fill);min-height:clamp(340px,30vw,480px);display:flex;flex-direction:column}
.ar-head .ta-crumbs{padding-top:24px}
.ar-head-in{margin-top:auto;padding:48px var(--tg) 64px}
.ar-head .ta-h1{margin-top:0;overflow-wrap:break-word;hyphens:auto}
.ar-lead{margin-top:24px;max-width:1100px;font-size:clamp(24px,2.5vw,36px)!important;line-height:1.3!important}
.ar-also h2{font-size:clamp(28px,2.8vw,40px);font-weight:600;line-height:1.2}
@media (max-width:600px){.ar-head{min-height:0}.ar-head-in{padding:40px var(--tg) 48px}}
.ar-meta{margin-top:32px;padding:16px 0;border-top:1px solid #d4d4d4;border-bottom:1px solid #d4d4d4;font-size:15px;color:var(--muted)}
.ar-body{max-width:760px;margin:64px auto 0}
.ar-toc{position:sticky;top:120px;display:flex;flex-direction:column;border-left:1px solid #d4d4d4}
.ar-toc-h{font-size:14px;font-weight:700;text-transform:uppercase;padding:0 0 12px 20px}
.ar-toc button{text-align:left;padding:8px 0 8px 20px;font-size:16px;font-weight:500;color:var(--body2);margin-left:-1px;border-left:2px solid transparent}
.ar-toc button:hover{color:var(--ink);border-left-color:var(--ink)}
.ar-body section{scroll-margin-top:110px}
.ar-body section+section{margin-top:80px}
.ar-body h2{font-size:clamp(28px,2.6vw,36px);font-weight:600;line-height:1.2;margin-bottom:20px}
.ar-body p{font-size:19px;line-height:1.6;color:var(--body2);margin-top:16px}
.ar-body ul{margin-top:16px;padding-left:22px;font-size:19px;line-height:1.6;color:var(--body2);list-style:disc}
.ar-key{margin-top:32px;background:var(--soft);border-radius:20px;padding:32px 36px}
.ar-key-h{font-size:14px!important;font-weight:700;text-transform:uppercase;color:var(--ink)!important;margin-top:0!important}
.ar-key p+p{margin-top:8px;font-size:22px;font-weight:500;color:var(--ink);line-height:1.4}
.ar-fig{margin:40px 0 0;background:var(--soft);border-radius:20px;padding:32px 36px 24px}
.ar-bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;height:240px;align-items:end}
.ar-bar{display:flex;flex-direction:column;height:100%}
.ar-bar-pair{flex:1;display:flex;align-items:flex-end;gap:6px}
.ar-bar-pair span{flex:1;border-radius:6px 6px 0 0}
.ar-bar p{font-size:14px!important;font-weight:600;color:var(--ink)!important;margin-top:10px!important;line-height:1.3!important;min-height:2.6em}
.is-vol{background:#22282b}.is-int{background:#a9a9a5}
.ar-fig figcaption{margin-top:20px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.ar-leg{width:12px;height:12px;border-radius:3px;display:inline-block}
.ar-leg.is-int{margin-left:16px}

st og elitesport`]},Kosttilskud:{intro:`Kosttilskud kan flytte marginaler, hvis de bruges korrekt og på et dokumenteret grundlag.`,lead:`Vurder altid behov, effekt, sikkerhed og risiko sammen med en relevant fagperson, før du bruger et produkt.`,sections:[{title:`Team Danmarks 6-trinsmodel`,text:`Modellen hjælper atleten med at træffe et oplyst valg før brug af kosttilskud.`,points:[`Er produktet lovligt?`,`Er der videnskabelig dokumentation?`,`Er produktet testet for urenheder?`]},{title:`Behov og effekt`,text:`Et kosttilskud bør have et tydeligt formål og aldrig erstatte en varieret kost.`,points:[`Definér målet`,`Vurder dokumentationen`,`Følg effekten systematisk`]},{title:`Sikkerhed og ansvar`,text:`Atleten har selv ansvar for, hvad der indtages, og produkter kan indeholde udeklarerede eller forbudte stoffer.`,points:[`Brug batchtestede produkter`,`Tjek antidopingreglerne`,`Gem dokumentation`]},{title:`Etik og integritet`,text:`Valget skal også vurderes i forhold til sundhed, værdier og den kultur, atleten er en del af.`,points:[`Tal med dit ekspertteam`,`Vær kritisk over for markedsføring`,`Undgå hurtige løsninger`]}],metricTitle:`Før du vælger`,metrics:[[`6 trin`,`Beslutningsmodel`,`Behov, effekt, sikkerhed og ansvar`],[`100 %`,`Atletens ansvar`,`Du er ansvarlig for alt, du indtager`]],related:[`Team Danmarks 6-trinsmodel`,`Antidoping Danmark`]},"Kropskomposition og vejning":{intro:`Anbefalinger til vejning og til samtaler om vægt og kropskomposition.`,lead:`Vægt er kun én blandt mange præstationsparametre. Enhver måling skal have et fagligt formål og foregå i trygge rammer.`,sections:[{title:`Fokus på den hele atlet`,text:`Kommunikation skal handle om præstation, sundhed og optimale betingelser frem for udseende.`,points:[`Et tydeligt formål`,`Feedback og opfølgning`,`Viden om hjælp og støtte`]},{title:`Undgå uhensigtsmæssig kommunikation`,text:`Sammenligninger, offentlige kommentarer og humor om vægt kan skabe utilsigtede reaktioner.`,points:[`Tal ikke om vægt foran andre`,`Undgå kommentarer om madvalg`,`Fokusér ikke kun på udseende`]},{title:`Retningslinjer for vejning`,text:`Vejning bør foretages af sundhedsfagligt kompetente personer og som udgangspunkt ikke af atleter under 18 år.`,points:[`Informeret samtykke`,`Fortrolig databehandling`,`Privat og trygt rum`]},{title:`Måling af kropskomposition`,text:`Målingen bør udføres af erfarne sundhedsprofessionelle og sættes i sammenhæng med blandt andet væskestatus.`,points:[`Ensartet procedure`,`Faglig fortolkning`,`Opfølgende samtale`]}],metricTitle:`Grundprincipper`,metrics:[[`18 år`,`Udgangspunkt`,`Yngre atleter bør normalt ikke vejes`],[`Fortroligt`,`Data`,`Resultater deles ikke med andre`]],related:[`Anbefalinger om vægt og kropssammensætning`,`Retningslinjer for vejning`]},Spiseforstyrrelser:{intro:`Viden om tidlige tegn, forebyggelse og hjælp ved forstyrret spisning i eliteidræt.`,lead:`Tidlig og ikke-dømmende handling er afgørende, hvis en atlet får et problematisk forhold til mad, vægt eller krop.`,sections:[{title:`Hvad skal du være opmærksom på?`,text:`Reagér, hvis fokus på mad, vægt og kropskomposition bliver overdrevet eller påvirker trivsel og træning.`,points:[`Tal åbent om observationerne`,`Mød atleten informerende og ikke-dømmende`,`Vis vej til professionel hjælp`]},{title:`Risikovurdering`,text:`Ved moderat eller høj risiko bør atleten tilbydes en samtale med en sportsdiætist og følges tværfagligt.`,points:[`Vurder energi og kostvaner`,`Følg sundhed og psykologisk trivsel`,`Aftal rammer for træning og konkurrence`]},{title:`Forebyggelse`,text:`Trænere, forældre og andre ressourcepersoner er med til at forme kulturen omkring krop, vægt og mad.`,points:[`Skab et trygt miljø`,`Vær varsom med sprog og normer`,`Sæt sundhed før kropsideal`]},{title:`REM-S og hjælp`,text:`Relativ energimangel i sport kan påvirke både fysisk og psykisk sundhed, trivsel og præstation.`,points:[`Kend de tidlige tegn`,`Søg tværfaglig hjælp`,`Brug Team Danmarks procedure`]}],metricTitle:`Handling`,metrics:[[`Tidligt`,`Reagér`,`Jo tidligere, desto bedre mulighed for hjælp`],[`Tværfagligt`,`Samarbejd`,`Diætist, psykolog, læge og træner`]],related:[`Tegn på forstyrret spisning`,`REM-S`,`E-læring om spiseforstyrrelser`]},"Røgfri nikotin og elitesport":{intro:`Snus, nikotinposer og andre røgfri nikotinprodukter kan påvirke præstation, restitution og sundhed negativt.`,lead:`Den oplevede skarphed skyldes ofte lindring af abstinenser. Forskningen peger ikke på en reel præstationsfordel.`,sections:[{title:`Fem grunde til at droppe nikotin`,text:`Nikotin kan belaste kredsløbet, forstyrre restitutionen og skabe afhængighed.`,points:[`Forbedrer ikke præstationen`,`Øger puls og blodtryk`,`Kan forstyrre søvn og genopladning`,`Er stærkt vanedannende`,`Kan skade sundheden`]},{title:`Kognitiv og fysisk præstation`,text:`Hos ikke-brugere kan nikotin øge rastløshed og nervøsitet og forringe koncentrationen.`,points:[`Ingen dokumenteret præstationsgevinst`,`Mulig negativ effekt på udholdenhed`,`Ingen entydig effekt på muskelstyrke`]},{title:`Afhængighed og sundhed`,text:`Nikotin påvirker hjernens belønningssystem og kan skade mundhule, søvn og mental sundhed.`,points:[`Afhængighed kan opstå hurtigt`,`Øget risiko for angst og depression`,`Mulige langsigtede stofskifterisici`]},{title:`Hvad kan miljøet gøre?`,text:`Trænere og klubber kan forebygge gennem tydelige rammer, viden og støtte til at stoppe.`,points:[`Vær rollemodel`,`Skab en nikotinfri kultur`,`Tilbyd hjælp og alternativer til stresshåndtering`]}],metricTitle:`Konsekvenser`,metrics:[[`0`,`Præstationsgevinst`,`Nikotin er ikke præstationsfremmende`],[`5`,`Gode grunde`,`Præstation, kredsløb, afhængighed, restitution og sundhed`]],related:[`Stoplinien`,`Kost og elitesport`]}};

const A={Sportspsykologi:{intro:`Mentale redskaber til at optimere i medgang og håndtere modgang.`,lead:`Præstationer hænger tæt sammen med tanker og følelser. Sportspsykologien arbejder med både atleten, teamet og miljøet omkring dem.`,sections:[{title:`Atleten i centrum`,text:`Arbejdet tager udgangspunkt i identitet, drivkraft, hverdagsliv og de krav, atleten møder.`,points:[`Identitet og mening`,`Livet som eliteatlet`,`Handling under pres`]},{title:`Teams, kultur og trivsel`,text:`Præstation og samarbejde udvikles gennem tydelige mål, roller, adfærd og et sundt miljø.`,points:[`Psykologisk tryghed`,`Fælles værdier`,`Mental sundhed`]}],metrics:[[`Atlet`,`Individ`,`Tanker, følelser og handlinger`],[`Team`,`Samarbejde`,`Kultur, roller og adfærd`]],related:[`Sportspsykologisk filosofi`,`Sportspsykologisk model`]},Mindfulness:{intro:`Træn opmærksomheden og vær fuldt til stede i den aktuelle opgave.`,lead:`Mindfulness hjælper atleten med at registrere tanker, følelser og kropslige reaktioner uden at miste fokus på præstationen.`,sections:[{title:`Åndedræt og afspænding`,text:`Øvelserne træner nærvær og evnen til at registrere kroppens tilstand.`,points:[`Åndedrætsøvelser`,`Bodyscan`,`Progressiv muskelafspænding`]},{title:`Visualisering og performance`,text:`Øvelserne kan skabe ro og styrke arbejdet med værdier, pres og vigtige præstationer.`,points:[`Et roligt sted`,`Optakt`,`Evaluering`,`Mental styrke`]}],metrics:[[`Nærvær`,`Opmærksomhed`,`Fokus på den aktuelle opgave`],[`Dagligt`,`Træning`,`Gentagelse skaber effekt`]],related:[`Mindfulness-øvelser`]},Compassion:{intro:`Et redskab til at fremme trivsel og præstation på samme tid.`,lead:`Compassion kombinerer tryghed og balance med modet til at stille krav, møde udfordringer og handle hensigtsmæssigt.`,sections:[{title:`Tre flows`,text:`Alle tre retninger er vigtige og skal udvikles parallelt.`,points:[`Give compassion`,`Modtage compassion`,`Self-compassion`]},{title:`En færdighed, du kan træne`,text:`Øvelserne kan bru d`]],related:[`Sportspsykologisk teammodel som PDF`]}};

const M={Sportsmedicin:{intro:`Forebyggelse og behandling af skader, infektioner og sygdom omkring træning og konkurrence.`,lead:`Sportsmedicin hjælper atleten med at forebygge problemer, reagere tidligt og vende sikkert tilbage til sporten.`,sections:[{title:`Forebyg skader`,text:`Opvarmning, varieret træning og gradvis belastning nedsætter risikoen for både akutte skader og overbelastning.`,points:[`Skadesforebyggende øvelser`,`Belastningsstyring`,`Kend kroppens signaler`]},{title:`Behandl og vend tilbage`,text:`Den rette tidlige indsats og en trinvis genoptræning hjælper vævet tilbage til sportens krav.`,points:[`PEACE & LOVE`,`Trappemodellen`,`Faglig vurdering`]},{title:`Sundhed omkring sporten`,text:`Infektioner, rejser og hjernerystelse kræver planlægning og tydelige kriterier for tilbagevenden.`,points:[`Forebyg infektion`,`Forbered rejsen`,`Vend gradvist tilbage`]}],metrics:[[`Forebyg`,`Før problemet`,`Opvarmning og gradvis belastning`],[`Reagér`,`Ved symptomer`,`Tidlig vurdering og behandling`]],related:[`Guidelines om hjernerystelse`,`Skadesforebyggende træning`]},"Skadesforebyggende træning":{intro:`Øvelser og træningsprincipper, der kan nedsætte risikoen for skader.`,lead:`Du kan aldrig sikre dig helt mod skader, men specifikke programmer og en grundig opvarmning kan reducere risikoen.`,sections:[{title:`Opvarmning`,text:`Opvarmningen skaber mental og fysisk parathed og forbedrer musklernes og senernes arbejdsbetingelser.`,points:[`Mental parathed`,`Fysisk parathed`,`Skadesforebyggelse`,`Bedre performance`]},{title:`Målrettede øvelser`,text:`Øvelser vælges efter sportens bevægelser og atletens risikoprofil.`,points:[`Skulderens udadrotation`,`Copenhagen Adduction`,`Nordic Hamstring`]}],metrics:[[`100 %`,`Kan ikke garanteres`,`Risikoen kan reduceres`],[`3`,`Øvelseseksempler`,`Skulder, lyske og baglår`]],related:[`Videoer med skadesforebyggende øvelser`]},"Akutte skader":{intro:`Gode råd til den første behandling og den trinvise vej tilbage efter en akut skade.`,lead:`En akut skade opstår ofte ved kraftfulde bevægelser eller hurtige retningsskift og bør håndteres med PEACE & LOVE.`,sections:[{title:`PEACE`,text:`De første dage handler om at beskytte vævet og undgå tiltag, som kan hæmme helingen.`,points:[`Protection`,`Elevation`,`Avoid anti-inflammatories`,`Compression`,`Education`]},{title:`LOVE`,text:`Den efterfølgende fase bygger gradvist bevægelse, styrke og tillid op igen.`,points:[`Load`,`Optimism`,`Vascularisation`,`Exercise`]},{title:`Genoptræning`,text:`Belastningen øges trin for trin, når vævet kan klare den uden mere smerte eller hævelse.`,points:[`Følg trappemodellen`,`Træn konkurrencesituationer`,`Vurder reaktionen dagen efter`]}],metrics:[[`PEACE`,`Tidlig fase`,`Beskyt og understøt helingen`],[`LOVE`,`Aktiv fase`,`Belast og genopbyg gradvist`]],related:[`PEACE & LOVE-guiden`,`Trappemodellen`]},Overbelastningsskader:{intro:`Forebyg overbelastning og vend tilbage til sporten trin for trin.`,lead:`Overbelastning opstår, når træningsmængden overstiger det, muskler, sener, led eller knogler kan klare.`,sections:[{title:`Kend de tidlige tegn`,text:`Ømhed, morgenstivhed og forværring efter aktivitet kan være kroppens advarsel.`,points:[`Smerte eller hævelse`,`Stivhed ved opstart`,`Symptomer dagen efter`]},{title:`Styr belastningen`,text:`Væn kroppen gradvist til større mængde, intensitet eller nye træningsformer.`,points:[`Brug træningsdagbog`,`Træn varieret`,`Inddrag søvn og hverdag`]},{title:`Tilbage til sporten`,text:`Find årsagen og øg kun belastningen, når kroppen reagerer stabilt.`,points:[`Trinvis genoptræning`,`Monitorér symptomer`,`Øg cirka 10 procent om ugen`]}],metrics:[[`10 %`,`Retningslinje`,`Gradvis ugentlig stigning`],[`Tidligt`,`Reagér`,`Lyt til kroppens signaler`]],related:[`Trappemodellen`,`Træningsdagbog`]},Hjernerystelse:{intro:`Viden om symptomer og en sikker, gradvis tilbagevenden til sport.`,lead:`En hjernerystelse kræver ro i den tidlige fase, opmærksomhed på faresignaler og gradvis gen const ANNOT4={
fp:[`Alle, der besøger teamdanmark.dk: atleter, forældre, trænere, samarbejdspartnere og presse.`,`At vise, hvad Team Danmark er til for, og hjælpe den besøgende hurtigt videre.`,`Forsiden fortæller, at Team Danmark står bag atleterne, og at mennesker og medaljer hænger sammen.`,`Man møder først brand statement og det, der sker lige nu. Derefter fører siden videre til de tre store områder: atleten, viden og talent. Konkurrencer og atlethistorier giver liv, og nederst er der hjælp og praktiske genveje.`],
ta:[`Atleter i alle aldre og på alle niveauer.`,`At vise, at Team Danmark står bag atleten hele karrieren igennem.`,`Her samles det, der gør hverdagen lettere: støtte, uddannelse, karriere og hjælp, når noget er svært.`,`Man starter med, hvor man er i sin karriere, og finder derefter det emne, der passer. Historier fra andre atleter viser, at man ikke er alene, og nederst er hjælpen altid let at finde.`],
ts:[`Atleter og trænere.`,`At vise, at Team Danmark er et videnscenter for dansk eliteidræt.`,`Her samles viden om kroppen, kosten, det mentale, skader og teknologi, så man let finder det, der kan gøre en forskel for præstationen.`,`Man møder først budskabet om viden, der er afprøvet i praksis. Derefter vælger man et af de fem fagområder. Undervejs får man værktøjer og historier om viden i brug, og til sidst møder man eksperterne og kan få faglig sparring.`],
tu:[`Forældre, trænere, klubber, kommuner og forbund.`,`At vise, at fremtidens elite bygges i fællesskab og over tid.`,`Siden samler de værdier og det samarbejde, talentudviklingen i Danmark bygger på.`,`Man møder først budskabet om, at udvikling tager tid, og vælger derefter sin rolle: forælder, træner eller kommune og forbund. Bagefter kommer de fire ting, talentudviklingen bygger på, eksempler fra miljøerne og en invitation til at være med.`],
om:[`Samarbejdspartnere, presse, forskere og andre, der vil kende Team Danmark.`,`At give et klart billede af, hvem Team Danmark er, og hvad organisationen står for.`,`Siden samler organisationen, ansvaret, forskningen, menneskerne og partnerne.`,`Man møder først mennesker og medaljer og vælger derefter det emne, man søger. Tal og eksempler viser omfanget af arbejdet, og nederst møder man medarbejderne.`],
su:[`Unge atleter på vej fra talent til elite og deres forældre.`,`At vise, at Team Danmark hjælper med at få sport, skole og livet til at hænge sammen.`,`Siden samler det, en ung atlet skal vide om skole, sportslig godkendelse og talentprogrammet.`,`Man møder først løftet om rette hjælp på rette tidspunkt og finder derefter det emne, man har brug for. Tidslinjen viser vejen, som den ofte ser ud, og historier fra andre atleter gør den konkret. Til sidst er der svar på spørgsmål og hjælp til forældre.`],
ud:[`Unge atleter, der vil kombinere sport og uddannelse, og deres forældre.`,`At vise, at man ikke skal vælge mellem sport og uddannelse.`,`Siden forklarer mulighederne fra folkeskole til universitet og gør det let at søge sportslig godkendelse.`,`Man ser først, hvordan sport og uddannelse kan kombineres, og hvornår fristen er. Derefter vælger man sit uddannelsesniveau, læser om fordelene og følger trinnene til ansøgning. Informationsmøder og spørgsmål hjælper dem, der stadig er i tvivl.`],
ds:[`Atleter, der er indplaceret hos Team Danmark.`,`At gøre det tydeligt, hvilken støtte man får, og hvad der forventes.`,`Siden samler ekspertsupport, økonomisk støtte, faciliteter og appen, som er indgangen til det hele.`,`Man starter med, hvordan Team Danmark kan hjælpe, og hvordan man kommer i gang via appen. Derefter ser man, hvor man passer ind i støttekonceptet, hvad man får, og hvad der forventes. Til sidst er der svar på de mest almindelige spørgsmål.`],
mp:[`Unge atleter på vej frem og erfarne atleter, der vil give noget videre.`,`At få flere til at søge ind som mentee eller mentor.`,`Siden forklarer, hvordan programmet fungerer gennem et år, og hvad man får ud af det.`,`Man møder først idéen bag programmet og ansøgningsfristen. Derefter ser man udbyttet, hvem der kan deltage, og hvordan året forløber. Erfaringer fra mentorpar gør det konkret, og spørgsmål og kontakt hjælper videre.`],
kl:[`Atleter, der vil arbejde eller studere ved siden af sporten, og virksomheder.`,`At vise, at Team Danmark hjælper med det, der kommer efter karrieren.`,`Siden samler fleksible job, praktik, karrierevejledning og temaet om atletkompetencer.`,`Man ser først, hvordan sport og arbejde kan kombineres, og finder derefter det tilbud, der passer. Trinnene viser, hvordan man kommer i gang, og videoerne viser atleter, der allerede har taget skridtet. Nederst er der en indgang for virksomheder.`],
ah:[`Atleter, forældre og alle, der er interesseret i mennesket bag præstationen.`,`At vise, at der står et menneske bag hver præstation.`,`Siden samler historier om vejen ind i sporten, hverdagen, skader, trivsel og livet efter.`,`Man vælger et tema og bladrer i historierne. Et citat fra en atlet giver en pause, og nederst kan man selv dele sin historie.`],
fh:[`Atleter, trænere og forældre, der har brug for hjælp.`,`At gøre det let og trygt at finde den rigtige hjælp.`,`Siden samler EliteSupport, kontakt og medarbejdere ét sted.`,`Man ser først, hvordan man får hjælp, og hvor man melder uacceptabel adfærd. Derefter vælger man den hjælp, der passer, og ser, hvem man skal kontakte. Spørgsmål og svar tager sig af resten.`],
kf:[`Atleter og trænere.`,`At vise, hvordan målrettet fysisk træning bygger en krop, der kan klare kravene i eliteidræt.`,`Siden samler viden om styrketræning, periodisering, restitution og højderum.`,`Man møder først løftet om træning tilpasset atleten og vælger derefter et emne. Værktøjer og eksempler viser, hvordan viden bruges i hverdagen, og til sidst møder man eksperterne.`],
ke:[`Atleter og trænere.`,`At vise, at det, atleten spiser og drikker, er en del af træningen.`,`Siden samler viden om kost, væske, kosttilskud og energibehov.`,`Man møder først løftet om ernæring tilpasset atleten og vælger derefter et emne. Energiberegner og dagsplaner gør det praktisk, og til sidst møder man eksperterne og kan få svar på spørgsmål.`],
mt:[`Atleter og trænere.`,`At vise, at mennesket og præstationen hænger sammen.`,`Siden giver redskaber til at træne det mentale og passe på trivslen.`,`Man møder først budskabet om, at det mentale kan trænes, og vælger derefter et emne. Modellen for mental sundhed og eksempler fra hverdagen gør det konkret, og til sidst møder man konsulenterne.`],
sb:[`Atleter og trænere.`,`At vise, at Team Danmark er der, når kroppen siger fra.`,`Siden hjælper med at forebygge skader, handle rigtigt, når de sker, og komme sikkert tilbage.`,`Man møder først løftet om behandling tilpasset atleten og vælger derefter et emne. Trinnene viser vejen tilbage efter en skade, og til sidst møder man eksperterne.`],
tp:[`Atleter, trænere og forbund.`,`At vise, hvordan teknologi og data kan gøre en forskel i de små marginaler.`,`Siden samler viden om teknologi, biomekanik og præstationsanalyse.`,`Man møder først budskabet om de små marginaler og vælger derefter et emne. Eksempler viser, hvordan data bruges før, under og efter konkurrencen, og til sidst møder man eksperterne.`],
fo:[`Forældre til børn og unge, der dyrker sport.`,`At give forældre viden og ro til at støtte deres barn.`,`Siden samler forældreguiden, gode råd og undervisningsmateriale.`,`Man ser først, hvordan man kan støtte sit barn, og finder derefter guiden og materialerne. De ni gode råd giver noget at handle på med det samme, og spørgsmål og kontakt hjælper videre.`],
tr:[`Trænere og ledere i talentmiljøer.`,`At give trænere viden og redskaber til at udvikle talenter og stærke miljøer.`,`Siden samler ATK 2.0, TalentHUSET, Life Skills og kompetenceudvikling.`,`Man ser først, hvordan man udvikler talenter, og finder derefter materialerne. De fem værdier for talentudvikling giver retning, og eksempler fra hverdagen gør det konkret.`],
km:[`Kommuner og specialforbund.`,`At vise, hvordan talentudvikling lykkes lokalt i samarbejde med Team Danmark.`,`Siden samler Elitekommuner, støttekoncepter og kompetenceudvikling.`,`Man ser først, hvordan samarbejdet fungerer, og finder derefter koncepter og aftalegrundlag. Trinnene viser, hvordan en kommune bliver Elitekommune, og eksempler viser arbejdet i praksis.`],
hv:[`Samarbejdspartnere, presse, politikere og andre interesserede.`,`At fortælle, hvorfor Team Danmark findes, og hvad organisationen står for.`,`Siden samler vision, strategi, organisation og rammerne for arbejdet.`,`Man møder først formålet og vælger derefter det emne, man søger. Atletens rejse viser, at Team Danmark følger atleten hele vejen, og nederst møder man ledelsen.`],
ae:[`Atleter, trænere, forældre og forbund.`,`At vise, at mennesket altid kommer før medaljen.`,`Siden samler EliteSupport, antidoping, etisk kodeks og tilsyn.`,`Man ser først, hvordan Team Danmark tager ansvar, og hvor man melder noget, der ikke er i orden. Derefter finder man viden om de enkelte emner og ser, hvordan tilsynet foregår.`],
fu:[`Forskere, forbund og trænere.`,`At vise, at ny viden er vejen til verdensklasse.`,`Siden samler forskningsområder, resultater, støtte og samarbejdspartnere.`,`Man ser først, hvordan forskning bruges, og finder derefter det emne, man søger. Eksempler viser forskning i praksis, og nederst kan man læse, hvordan man søger støtte til et projekt.`],
me:[`Alle, der skal finde den rette person.`,`At gøre det let at komme i kontakt med Team Danmark.`,`Siden viser alle medarbejdere fordelt på arbejdsområder.`,`Man kan søge efter navn eller filtrere på arbejdsområde. Presse har deres egen indgang øverst.`],

qs:[[`Hvad gør jeg, når jeg er blevet skadet?`,`Beskyt det skadede område de første dage, løft det over hjertehøjde, og brug en elastisk bind til kompression. Undgå antiinflammatorisk medicin og is. Begynd derefter på smertefri genoptræning.`,`Læs om akutte skader`,`Akutte skader`],[`Må jeg tage Ipren?`,`Start med paracetamol. NSAID som Ipren kan forsinke helingen og bør kun bruges kortvarigt og helst i samråd med en læge.`,`Læs om akutte skader`,`Akutte skader`],[`Hvornår skal jeg kontakte en læge?`,`Altid ved mistanke om brud eller overrevet ledbånd. Gå gerne også til en fysioterapeut for vejledning.`,`Læs om akutte skader`,`Akutte skader`],[`Hvordan undgår jeg overbelastning?`,`Byg belastningen gradvist op, og ændr ikke mængde, intensitet eller type af træning for brat. Som retningslinje kan du øge belastningen med ca. 10 procent om ugen.`,`Læs om overbelastning`,`Overbelastningsskader`],[`Hvor lang tid tager det at komme sig over en hjernerystelse?`,`De fleste voksne sportsudøvere kommer sig i løbet af 10-14 dage. Følg DIF's guidelines, når du skal tilbage til sporten.`,`Læs om hjernerystelse`,`Hjernerystelse`],[`Hvordan undgår jeg at blive syg?`,`Sov nok, spis nok, og undgå langvarig stress. Vask hænder ofte, og bliv hjemme, hvis du er syg. Tag 10 µg D-vitamin dagligt fra oktober til april.`,`Læs om infektioner og influenza`,`Infektioner og influenza`]],

qs:[[`Hvordan kan jeg støtte mit barn bedst?`,`Giv både praktisk og følelsesmæssig støtte, men lad barnet selv tage ansvar. Forældreguiden giver dig redskaber til forskellige situationer.`,`Se forældreguiden`,`Forældreguide`],[`Skal jeg være med til al træning?`,`Nej. Det er godt at vise interesse, men dit barn skal også have plads til at tage ansvar og stå på egne ben.`,`Se de gode råd`,`Gode råd til sportsforældre`],[`Hvordan giver jeg god feedback efter en konkurrence?`,`Tag udgangspunkt i dit barns egen udvikling frem for at sammenligne med andre, ros indsatsen, og stil åbne spørgsmål, der får barnet til at reflektere.`,`Se de gode råd`,`Gode råd til sportsforældre`],[`Hvad er talentklasser?`,`Særlige klasser for elever i 7.-9. klasse på udvalgte skoler i Team Danmarks Elitekommuner. Eleverne træner 2-3 gange om ugen, typisk som morgentræning i skoletiden.`,`Læs om talentklasser`,`Talentklasser`],[`Hvordan bruger jeg forældreguiden?`,`Læs guiden, før du deltager i en workshop. Den er bygget op om ti temaer, fx motivation, feedback, trivsel og den sammenhængende hverdag.`,`Se forældreguiden`,`Forældreguide`],[`Må vi bruge materialet i vores klub?`,`Ja, så længe I krediterer Team Danmark og Kolding Talent og ikke bruger materialet kommercielt.`,`Se materialerne`,`Undervisningsmateriale`]],

tools:[[`Hvorfor vi findes`,`Team Danmark er oprettet ved Lov om eliteidræt fra 1984 og har ansvaret for dansk eliteidræt. Loven fastsætter vores opgaver, fx talentudvikling, økonomisk støtte til atleter og forskning, og forpligter os til at udvikle eliteidrætten på en socialt og samfundsmæssigt forsvarlig måde. Vi arbejder tæt sammen med Danmarks Idrætsforbund, specialforbundene og kommunerne, og kulturministeren og DIF udpeger hver halvdelen af vores bestyrelse.`,`Læs om ansvarlig eliteidræt`,``,`data-act="sub" data-a="3" data-t="Ansvarlig eliteidræt"`],[`Det forventer staten af os`,`Rammeaftalen med Kulturministeriet fastlægger målene for Team Danmarks arbejde i aftaleperioden.`,`Download pdf`,``],[`Sådan prioriterer vi`,`Vores strategi og støttekoncept, Næste niveau, beskriver vores prioriteter for 2025-2028, og hvordan vi samarbejder med forbundene.`,`Download pdf`,`Strategi og støttekoncept`],[`Årsberetning`,`Årsberetningen samler årets resultater og indsatser. I 2024 var 1.215 atleter kategoriseret, og vi havde 56 uddannelsespartnere på ungdomsuddannelserne.`,`Download pdf`,``]],
stepsH:`Vi følger atleten hele vejen.`,stepsLabel:`Atletens rejse`,
steps:[[`Fase 1`,`Begyndelsen i klubben`,`Talentet bliver formet i klubben. Vi giver trænere og forældre viden og redskaber gennem ATK 2.0, TalentHUSET og forældreguiden.`],[`Fase 2`,`Ungdom og uddannelse`,`Talentklasser i 7.-9. klasse og ungdomsuddannelser på fleksible vilkår, så sport og skole kan hænge sammen.`],[`Fase 3`,`Elite og verdensklasse`,`Eksperter i træning, ernæring, psykologi, medicin og teknologi, økonomisk støtte og et mentorprogram for atleterne.`],[`Fase 4`,`Livet efter sporten`,`Karriererådgivning og hjælp til overgangen, når den sportslige karriere slutter.`]],
stepsNote:``,

feature:[`22. september 2026`,`Ny satsning skal give danske idrætstalenter flere veje til verdensklasse`],

qs:[[`Hvordan er Team Danmark finansieret?`,`Team Danmark er finansieret af staten, primært gennem udlodningsmidlerne og finansloven. Derudover kommer der indtægter fra kommercielle samarbejder gennem DIF og Team Danmark Kommerciel.`,``,``],[`Hvad er Team Danmark?`,`En offentlig selvejende institution, der skal udvikle dansk eliteidræt på en socialt og samfundsmæssigt forsvarlig måde. Opgaverne er fastsat i Lov om eliteidræt.`,`Læs om vision og mission`,`Vision og mission`],[`Hvem bestemmer over Team Danmark?`,`Bestyrelsen er det øverste organ. Den har otte medlemmer. Fire udpeges af kulturministeren, herunder formanden, og fire af Danmarks Idrætsforbund.`,`Se bestyrelsen`,`Organisation og bestyrelse`],[`Hvilke sportsgrene støtter Team Danmark?`,`Ifølge loven prioriterer Team Danmark sportsgrene med tradition for højt internationalt niveau, og hvor der kan laves et troværdigt og langsigtet talentarbejde.`,`Læs om støttekonceptet`,`Strategi og støttekoncept`],[`Hvad betyder Mennesker og medaljer?`,`At vejen til medaljer går gennem et arbejde med det hele menneske gennem hele karrieren. Derfor støtter vi også uddannelse, trivsel og livet uden for sporten.`,`Læs om vision og mission`,`Vision og mission`],[`Hvor mange atleter støtter Team Danmark?`,`I 2024 var 1.215 atleter kategoriseret af Team Danmark.`,``,``],[`Hvornår blev Team Danmark grundlagt?`,`Den første lov om eliteidræt blev underskrevet 19. december 1984, og Team Danmark fejrede 40-års jubilæum i 2024.`,``,``]],

statement:`Vi udvikler dansk eliteidræt på en socialt og samfundsmæssigt forsvarlig måde.`,
introH:`Sådan tager vi ansvar`,
introP:`Det er et krav i Lov om eliteidræt, og derfor spiller ansvarlighed en helt central rolle i vores arbejde. Vi løfter opgaven sammen med atleter, trænere, forbund og Elitekommuner.`,
introBtn:[`Læs om Lov om eliteidræt`,`Lov om eliteidræt`],
topicsH:`Find viden om ansvarlig eliteidræt`,
topics:[[`Elitesupport`,`Sig fra over for uacceptabel adfærd.`],[`Antidoping`,`Doping hører ikke hjemme blandt atleter.`],[`Sport og spillekultur`,`Regler for spil og matchfixing.`],[`Aktører`,`Atleters, træneres, forbunds og Elitekommuners ansvar.`],[`Etisk kodeks`,`Fælles regler for etik i dansk konkurrenceidræt.`],[`Tilsynsprocedure`,`Sådan følger vi op på forbundenes arbejde.`],[`Lov om eliteidræt`,`Grundlaget for vores arbejde.`]],
stepsH:`Alle omkring atleten har et ansvar.`,stepsLabel:`Aktører og ansvar`,
steps:[[`Atleter`,`Ansvar for egen karriere`,`Atleten tager ansvar for centrale dele af karrieren, behandler andre med omsorg og respekt og beder om hjælp, når der er brug for det.`],[`Trænere`,`Mennesket før resultatet`,`Træneren har en klar trænerfilosofi, støtter atletens selvstændighed og skaber et trygt miljø med fokus på præstation, udvikling og trivsel.`],[`Forældre`,`Barnets behov først`,`Forældre støtter barnets læring og trivsel, tager udgangspunkt i barnets behov og er med til at skabe et godt klubmiljø.`],[`Forbund`,`En professionel organisation`,`Forbundet har en vedtaget elitepolitik, en klar ansvarsfordeling og en tydelig adskillelse mellem politik og drift.`],[`Elitekommuner`,`Gode talentmiljøer`,`Kommunen udvikler talentmiljøer sammen med forbundene og gør det muligt at kombinere elitesport og uddannelse.`],[`Team Danmark`,`Tilsyn og opfølgning`,`Vi stiller krav i samarbejdsaftalerne, fører tilsyn med forbundene og følger hvert år atleternes trivsel.`]],
stepsNote:`Fra Team Danmarks beskrivelse af aktører og ansvar og det etiske kodeks.`,
toolsH:`Sådan fører vi tilsyn`,
tools:[[`Vi følger forbundenes arbejde`,`Hvert forbund laver en masterplan med strategier og årlige mål, og samarbejdsaftalen er en forudsætning for støtten. Arbejdsgrupper og en årlig styregruppe følger op.`,``,``],[`Vi er til stede og spørger atleterne`,`Vores medarbejdere er ofte med i træning, på lejre og til konkurrencer. Hvert år svarer atleterne anonymt på en undersøgelse om trivsel.`,``,``],[`Når noget ikke er i orden`,`De fleste sager løses gennem dialog mellem forbundet og Team Danmark, og ledelserne inddrages efter behov. Atleter og trænere kan også henvende sig anonymt.`,`Se tilsynsproceduren`,`Tilsynsprocedure`]],
storiesH:`Ansvarlig eliteidræt i praksis`,
feature:[`Trivsel`,`Mennesket før medaljen`],
stories:[[`Etisk kodeks`,`Når grænser bliver overskredet`],[`Antidoping`,`Ren sport fra start`],[`Spillekultur`,`Når spil bliver et problem`],[`Trænere`,`Trænerfilosofi i praksis`]],

qs:[[`Hvor kan jeg sige fra, hvis noget er galt?`,`Indplacerede atleter og trænere kan indberette uacceptabel adfærd til EliteSupport. Henvendelserne behandles af Anti Doping Danmark, så de bliver behandlet uafhængigt af Team Danmark og forbundene.`,`Gå til EliteSupport`,``,`data-act="sub" data-a="0" data-t="Få hjælp og rådgivning"`],[`Hvem har lavet det etiske kodeks?`,`Team Danmark og Danmarks Idrætsforbund har lavet det sammen. Det gælder for dansk konkurrenceidræt, herunder eliteidrætten, og blev senest revideret i 2022.`,`Læs om etisk kodeks`,`Etisk kodeks`],[`Må jeg spille på min egen sport?`,`Spil på egne kampe og misbrug af intern viden er forbudt. Har du kendskab til eller mistanke om matchfixing, skal du indberette det til Spillemyndigheden.`,`Læs om spillekultur`,`Sport og spillekultur`],[`Hvordan tjekker jeg, om min medicin er tilladt?`,`Brug Anti Doping Danmarks medicin-app. Den viser, om medicinen er tilladt eller forbudt efter dopinglisten.`,`Læs om antidoping`,`Antidoping`],[`Hvem står for dopingkontrollen?`,`Anti Doping Danmark, som er et uafhængigt agentur mellem Kulturministeriet og idrættens organisationer.`,`Læs om antidoping`,`Antidoping`],[`Hvordan fører Team Danmark tilsyn med forbundene?`,`Gennem masterplanen og samarbejdsaftalen, løbende opfølgning, tilstedeværelse i elitemiljøerne og årlige undersøgelser blandt atleterne.`,`Se tilsynsproceduren`,`Tilsynsprocedure`]],
help:[``,`Har du oplevet noget, der ikke er i orden?`,`Gennem EliteSupport kan indplacerede atleter og trænere indberette uacceptabel adfærd. Henvendelserne behandles af Anti Doping Danmark, så de bliver behandlet uafhængigt af Team Danmark og forbundene.`,`Gå til EliteSupport`,`data-act="sub" data-a="0" data-t="Få hjælp og rådgivning"`],
more:[`Download etisk kodeks`,`Download spillepolitik`,`Indberet matchfixing`]};

const FU={key:`fu`,title:`Forskning og udvikling`,sec:3,l3:true,nl:[`Få besked om nye publikationer`,`Nye resultater og publikationer fra Team Danmarks forskningsnetværk.`],storiesEarly:true,
statement:`Forskning gør os klogere på, hvad der skaber verdensklasse.`,
introH:`Sådan bruger vi forskning`,
introP:`Team Danmark samarbejder med danske forskningsmiljøer om ny viden, der kan bruges i træning og konkurrence. Vi vil styrke idrætsforskningen i Danmark og skabe en tæt dialog mellem forskere og dem, der arbejder med atleterne til daglig.`,
topicsH:`Find viden om forskning og udvikling`,
topics:[[`Resultater og viden`,`Nye resultater og publikationer.`],[`Forskningsstøtte og ansøgning`,`Sådan søger du støtte til et projekt.`],[`Forskningsnetværk og samarbejdspartnere`,`De forskningsmiljøer, vi samarbejder med.`],[`Nationalt elitesportscenter`,`Et nationalt forskningsprogram for eliteidræt.`]],
stepsH:`Sådan støtter vi forskning.`,stepsLabel:`Typer af støtte`,
steps:[[`Netværk`,`Forskningsnetværk`,`Større netværk af forskere og forskningsmiljøer, der arbejder sammen om et fælles tema over flere år.`],[`Projekter`,`Afgrænsede projekter`,`Konkrete og gerne tværinstitutionelle projekter med en tydelig værdi for eliteidrætten.`],[`Seed`,`Nye idéer`,`Mindre bevillinger til utraditionelle idéer med høj risiko og stort potentiale.`],[`Praksis`,`Viden i brug`,`Resultaterne deles med eksperter, trænere og forbund, så de kan bruges i træning og konkurrence.`]],
stepsNote:`Bygger på Team Danmarks bevillingsstrategi for forskning. Skal opdateres med den nuværende strategi.`,
toolsH:`Det forsker vi i`,
tools:[[`Krop og fysisk træning`,`Fx hvordan træning, restitution og højde påvirker præstationen. Netværket PRoKIT undersøger præstation og restitution i intervalidræt som håndbold, fodbold og ishockey.`,`Gå til Krop & fysisk træning`,``,`data-act="sub" data-a="1" data-t="Krop & fysisk træning"`],[`Kost og ernæring`,`Fx hvordan lavt energiindtag påvirker kvindelige atleter, og hvordan musklerne lagrer kulhydrat. Resultaterne bliver til konkrete kostråd.`,`Gå til Kost & ernæring`,``,`data-act="sub" data-a="1" data-t="Kost & ernæring"`],[`Mental sundhed og trivsel`,`Fx atleternes trivsel, som måles hvert år i Team Danmarks trivselsundersøgelse, og risikoen for spiseforstyrrelser i idrætten.`,`Gå til Mental træning & trivsel`,``,`data-act="sub" data-a="1" data-t="Mental træning & trivsel"`],[`Skader og sportsmedicin`,`Fx hvordan skader kan forebygges, og hvordan atleterne kommer bedst tilbage efter en skade.`,`Gå til Skader & behandling`,``,`data-act="sub" data-a="1" data-t="Skader & behandling"`],[`Teknologi og præstationsanalyse`,`Fx biomekanik, aerodynamik og analyse af data og video fra træning og konkurrence.`,`Gå til Teknologi & performance`,``,`data-act="sub" data-a="1" data-t="Teknologi & performance"`]],
journey:[`Et højdehotel til danske atleter`,`Med 100 mio. kr. fra Novo Nordisk Fonden har Team Danmark etableret et nationalt elitesportscenter. Halvdelen af pengene går til et forskningsprogram, og den anden halvdel går til faciliteter som et højdehotel og et klimakammer, hvor atleterne kan træne under forhold, de møder i konkurrencer verden over.`,`Læs om elitesportscentret`,`Nationalt elitesportscenter`],

qs:[[`Hvem kan søge forskningsstøtte?`,`Forskere og forskningsmiljøer kan søge, gerne i samarbejde med eksperter, trænere eller forbund. Kriterierne står under Forskningsstøtte og ansøgning.`,`Læs om ansøgning`,`Forskningsstøtte og ansøgning`],[`Hvilke typer støtte kan man søge?`,`Der kan søges støtte til forskningsnetværk, afgrænsede projekter og mindre seedprojekter med nye idéer.`,`Læs om ansøgning`,`Forskningsstøtte og ansøgning`],[`Hvornår er der ansøgningsfrist?`,`Fristerne bliver offentliggjort under Forskningsstøtte og ansøgning, når der er åbne opslag.`,`Læs om ansøgning`,`Forskningsstøtte og ansøgning`],[`Kan trænere og forbund foreslå et projekt?`,`Ja. Idéer fra praksis er vigtige for, at forskningen svarer på de spørgsmål, eliteidrætten har. Kontakt vores forskningsadministrator.`,``,``],[`Hvad er det nationale elitesportscenter?`,`Et nationalt forskningsprogram for eliteidræt, som Team Danmark har etableret med støtte fra Novo Nordisk Fonden.`,`Læs om elitesportscentret`,`Nationalt elitesportscenter`],[`Hvor kan jeg finde resultaterne?`,`Under Resultater og viden samler vi nye resultater, rapporter og artikler fra vores forskningsprojekter.`,`Se resultater og viden`,`Resultater og viden`]],

<article class="ar">

<div class="ar-body">
<section id="ar-what"><h2>Hvad er periodisering?</h2><p>At periodisere træningen betyder, at du planlægger, hvordan træningen ændrer sig over tid. Du kan fx ændre på:</p><ul><li>Rækkefølgen af øvelserne</li><li>Antallet af sæt og gentagelser i hvert sæt</li><li>Pausen mellem øvelser og sæt</li><li>Intensiteten, du træner med</li><li>Antallet af træningspas per dag, uge og måned</li></ul><div class="ar-key"><p class="ar-key-h">Målet</p><p>Du undgår at gå i stå, og formen topper på et eller flere bestemte tidspunkter, typisk til de store mesterskaber.</p></div></section>
<section id="ar-fit"><h2>Hvilken model passer til dig?</h2><div class="ar-fitgrid"><button type="button" class="ar-fitcard" data-act="ar-jump" data-t="ar-lin"><span class="ta-tag">Få konkurrencer om året</span><h3>Lineær periodisering</h3><p>Vægtløftning, styrkeløft, atletik, gymnastik, triatlon, cykling og andre sportsgrene, hvor du skal toppe til få konkurrencer.</p><span class="ar-fitgo">Læs om lineær periodisering ↓</span></button><button type="button" class="ar-fitcard" data-act="ar-jump" data-t="ar-non"><span class="ta-tag">Lang sæson</span><h3>Nonlineær periodisering</h3><p>Håndbold, fodbold, basket, volleyball, ishockey og andre sportsgrene, hvor du skal præstere stabilt hele sæsonen.</p><span class="ar-fitgo">Læs om nonlineær periodisering ↓</span></button></div></section>
<section id="ar-lin"><h2>Lineær periodisering</h2><p>I en lineær periodisering falder træningsvolumen, mens intensiteten stiger over tid. Du starter med høj volumen og lav intensitet og ender med høj intensitet og lav volumen. På den måde bygger du en formtop op i fx muskelstyrke, eksplosiv muskelstyrke eller hurtighed.</p><p>Jo længere tid du periodiserer over, desto større udbytte kan du potentielt få af træningen.</p>
<figure class="ar-fig"><div class="ar-bars" role="img" aria-label="Volumen falder og intensitet stiger fra muskelopbygning til formtopning">${ph.map(x=>`<div class="ar-bar"><div class="ar-bar-pair"><span class="is-vol" style="height:${lvl[x[4]]}%"></span><span class="is-int" style="height:${lvl[x[3]]}%"></span></div><p>${esc(x[0])}</p></div>`).join('')}</div><figcaption><span class="ar-leg is-vol"></span>Volumen <span class="ar-leg is-int"></span>Intensitet</figcaption></figure>
<div class="ar-tablewrap"><table class="ar-table"><caption>Principper i en lineær periodisering for muskelstyrke og eksplosiv muskelstyrke</caption><thead><tr><th scope="col">Periode</th><th scope="col">Sæt</th><th scope="col">Gentagelser</th><th scope="col">Intensitet</th><th scope="col">Volumen</th></tr></thead><tbody>${ph.map(x=>`<tr><th scope="row">${esc(x[0])}</th><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</tbody></table></div>
<p>Hvor lang tid du bruger i hver periode, afhænger af den tid, du har, din træningserfaring og dine styrker og svagheder. Vil du have det fulde udbytte af hver periode, bør du have mindst en til tre måneder til hver.</p></section>
<section id="ar-non"><h2>Nonlineær periodisering</h2><p>Nonlineær periodisering er en nyere model til sportsgrene med lange sæsoner, hvor du skal holde et højt fysisk niveau i lang tid. Målet er at opbygge og vedligeholde muskelstyrke, eksplosiv muskelstyrke og hurtighed gennem hele sæsonen.</p><p>Her varierer du volumen og intensitet, så niveauet stiger gradvist over en lang periode. At toppe på et bestemt tidspunkt er ikke det vigtigste. Typisk bruger du tre træningszoner: 4-6 RM, 8-10 RM og 12-15 RM.</p>
<div class="ar-week" role="table" aria-label="Eksempel på en uge med nonlineær periodisering"><div role="row"><span role="columnheader">Mandag</span><strong role="cell">8-10 RM</strong></div><div role="row"><span role="columnheader">Onsdag</span><strong role="cell">4-6 RM</strong></div><div role="row"><span role="columnheader">Fredag</span><strong role="cell">12-15 RM</strong></div></div>
<p>Når sæsonen er slut, eller når der er sommer- eller vinterpause, kan du køre en lineær periodisering for at forbedre bestemte fysiske egenskaber frem mod resten af sæsonen eller næste sæson.</p>
<div class="ar-tablewrap"><table class="ar-table"><caption>Eksempel på en opbygningsperiode i en pause</caption><thead><tr><th scope="col">Tid til rådighed</th><th scope="col">Muskelopbygning</th><th scope="col">Muskelstyrke</th><th scope="col">Eksplosiv muskelstyrke</th></tr></thead><tbody><tr><th scope="row">4 uger</th><td>2 uger</td><td>1 uge</td><td>1 uge</td></tr><tr><th scope="row">8 uger</th><td>4 uger</td><td>2 uger</td><td>2 uger</td></tr><tr><th scope="row">12 uger</th><td>4-6 uger</td><td>3-4 uger</td><td>3-4 uger</td></tr></tbody></table></div></section>
</div></article>

lead:`Sådan tilpasser du din styrketræning til din erfaring, og til om målet er muskelopbygning, muskelstyrke eller eksplosiv muskelstyrke.`,
blocks:[
['h2',`Få det fulde udbytte`],
['p',`Hvad og hvordan du skal træne, afhænger først og fremmest af din træningserfaring og dit niveau. Du skal også tage stilling til, hvad du vil opnå, hvor lang tid du har, og hvor mange gange om ugen du kan styrketræne.`],
['video',`Video: Fysisk træner Mads Brink Hansen fortæller, hvad du får ud af at styrketræne, og hvordan og hvor ofte du skal træne.`],

[`Eksplosiv muskelstyrke`,`Øvet`,`Tung &gt;80 %<br>Let* 30-50 %`,`3-6<br>3-10`,`1-3 / 3-5 min.`,`2-4`,`Maksimal<br>Maksimal`],
[`Eksplosiv muskelstyrke`,`Elite`,`Tung &gt;80 %<br>Let* 30-60 %`,`1-6<br>3-10`,`2-6 / 3-5 min.`,`2-6`,`Maksimal<br>Maksimal`]]],
['note',`*Udført som ballistisk eller SSC-styrketræning (stretch-shortening cycle).`],
['p',`Det betyder meget, hvordan det enkelte træningspas er bygget op. Men det betyder også noget, hvor mange gange om ugen du styrketræner.`],
['tiles',`Udbytte efter antal styrkepas om ugen`,[[`1 pas om ugen`,`Vedligeholder`],[`2 pas om ugen`,`Vedligeholder eller øger`],[`Mere end 2 pas`,`Øger`]]],
['h2',`Byg et fundament`],
['p',`Skal du have det fulde udbytte af din styrketræning, er det afgørende, at du tager dig tid til at bygge et fundament, som kan udvikles. Arbejd gerne langsigtet med et stærkt basalt styrkeniveau og en god teknik.`],
['p',`Har du ikke tid til både at bygge fundament, øve teknik og træne målrettet, må du prioritere, hvad der er vigtigst at nå på den tid, du har.`],
['h2',`Pres kroppen gradvist`],
['p',`Progressive overload betyder, at du over lang tid gradvist belaster kroppen hårdere. Vil du blive ved med at forbedre dig, er du nødt til at øge kravene til kroppen. Det kan du fx gøre ved at:`],
['ul',[`Øge belastningen eller intensiteten`,`Udføre øvelsen hurtigere (intentionel hastighed)`,`Ændre længden af pauserne`,`Øge træningsvolumen`]],
['p',`Følger du ikke de principper, kan dit niveau gå i stå.`],
['h2',`Træn målrettet`],
['p',`Du bliver god til det, du træner. Kroppen tilpasser sig den belastning, den bliver udsat for, fx hvilke muskler du træner, om du træner statisk eller dynamisk, med maskiner eller frie vægte, og med hvilken intensitet og volumen.`],
['p',`Utrænede bliver ofte bedre på mange områder på én gang. Jo mere erfaring du har, desto vigtigere er det at træne specifikt.`],
['h2',`Rækkefølgen betyder noget`],
['p',`Kroppen vænner sig hurtigt til et program, så variation holder træningen udfordrende. Intensitet og volumen er de mest effektive ting at ændre på. Rækkefølgen af øvelserne har også stor betydning:`],
['ol',[`Store muskelgrupper før små, fx squat før knæekstension`,`Øvelser med flere led før øvelser med ét led, fx squat før hælløft`,`De vigtigste øvelser før de mindre vigtige`,`Olympiske og eksplosive øvelser før styrkeøvelser, fx frivend og squat jump før squat og bænkpres`,`De mest intense øvelser før de mindre intense`]],
['key',`For de fleste atleter`,`Start med de eksplosive øvelser, tag derefter styrkeøvelserne og til sidst de forebyggende øvelser og træningen af kropsstammen.`],
['h2',`Varier programmet over tid`],
['p',`Planlagt variation i øvelser, belastning, pauser og volumen kaldes periodisering. Målet er at undgå stagnation og toppe formen på de rigtige tidspunkter.`],

'Restitution':{key:`re3`,title:`Restitution`,
lead:`Restitution er det, der gør dig klar til at træne igen. Den kræver planlægning, gentagelse og fokus.`,
blocks:[
['h2',`Basen giver det meste af fremgangen`],
['p',`Team Danmarks restitutionskoncept bygger på det, der beviseligt virker, og tager afsæt i den enkelte atlets hverdag og erfaringer. Konceptet er tegnet som en pyramide.`],
['pyr'],
['p',`Det vigtigste er derfor at have basen i orden. Det gør du ved at sikre kvalitet og kontinuitet i din træning, din kost, din søvn og din mentale og sociale genopladning.`],
['dl',`Team Danmarks restitutionskoncept`,`Hele konceptet samlet i én pdf.`,`Download pdf`],
['h2',`Derfor skal du restituere`],
['p',`Når du restituerer, bygger kroppen sig selv op igen. Trænede du non-stop, ville du nedbryde kroppen for meget. Du skal både restituere frem mod træning og konkurrence og bagefter, så du er klar til den næste opgave.`],
['h2',`Basen i fire dele`],
['cards',[[`Træning`,`Træn efter en plan`,`Træn målrettet og fokuseret, og byg træningen på specificitet, progression og variation.`],[`Søvn`,`Sov nok og godt`,`Opbyg gode søvnvaner, øg din nattesøvn, og overvej en performance-lur.`],[`Kost`,`Spis til din træning`,`Kend dit energibehov, justér dit kulhydratindtag, og prioritér kvalitetsprotein og umættet fedt.`],[`Genopladning`,`Fyld batterierne op`,`Prioritér det, der giver dig energi, book tid til sociale aktiviteter, og brug 10-15 minutter om dagen på mental genopladning.`]]],
['h2',`Toppen af pyramiden`],
['p',`Før du bruger aktiv nedvarmning, udspænding, kulde eller kompression, skal du overveje, hvor lang tid der er til næste træning. Er restitution nødvendig, hvad kan lade sig gøre, og hvilke metoder giver mest mening?`],
['h3',`Under 4 timer til næste træning`],
['ol',[`Varm ned i 5-10 minutter ved let intensitet.`,`Start den ernæringsmæssige restitution med væske og evt. et restitutionsmåltid, gerne mens du strækker ud.`,`Har du nem adgang til kulde- eller kontrastbehandling, kan du bruge den.`,`Tag kompressionstøj på lige efter nedvarmningen, og behold det på til næste opvarmning.`]],
['h3',`Cirka 12 timer til næste træning`],
['ol',[`Varm ned i 5-10 minutter ved let intensitet.`,`Start den ernæringsmæssige restitution, gerne mens du strækker ud.`,`Brug kuldebehandling i bassin, sø, hav eller balje eller kontrastbehandling i badet, hvis du kan.`,`Tag kompressionstøj på efter badet, og behold det på så længe som muligt. Træner du om eftermiddagen, kan du sove med det.`]],
['key',`Husk`,`Det er den samlede pakke, der tæller. Hver metode gør måske ikke den store forskel alene, men det gør de, når du bruger dem planlagt, gentaget og med fuldt fokus.`],
['h2',`Metoderne`],
['faq',[[`Aktiv restitution`,`Aktiv restitution kan være med til at fjerne mælkesyre, mindske ømhed og forbedre bevægeligheden. Den hjælper også med skiftet fra træning til restitution.`],[`Ernæringsmæssig restitution`,`Spis et restitutionsmåltid med cirka 0,5-1,0 gram protein og kulhydrat per kilo kropsvægt. Erstat 120-150 procent af den væske, du har tabt, inden for 4 timer efter træning.`],[`Statisk udspænding`,`Udspænding hjælper sammen med aktiv restitution med at få musklerne til at slappe af.`],[`Kulde- og kontrastbehandling`,`Det gør ikke den store forskel, om du bruger kulde eller kontrast. Effekten er størst, når du står i vand til skuldrene. Vil du kun ramme benene, er vand til hoften nok. Et bassin er bedre end en balje, og en balje er bedre end en bruser.`],[`Kompressionstøj`,`Kompression kan dæmpe ømhed og hævelse efter træning. Brug lange tights og langærmet trøje lige efter træning, og behold det på så længe som muligt. Der er effekt allerede efter cirka 30 minutter.`],[`Mindfulness og biofeedback`,`Mindfulness lærer dig at være til stede, så du lægger mærke til små skavanker. Biofeedback, fx HRV, giver dig feedback på din balance, så du selv lærer at mærke efter.`],[`Massage`,`Massage kan mindske ømhed efter hård og lang træning, især 2-3 timer efter. Det er ikke vist, at massage forbedrer præstationen, så prøv dig frem med timing og hårdhed.`],[`Game Ready`,`Justerbar kulde og kompression på led og muskler. Behandlingen tager 15-25 minutter og kan mindske hævelse, ømhed og smerter.`]]]],
people:[[`Christina Øyangen Ørntoft`,`Sportsfysiolog, faglig leder`,`2818-3425`,`coor@teamdanmark.dk`],[`Majke Jørgensen`,`Ernæringsfysiolog, faglig leder`,`2530-5907`,`majo@teamdanmark.dk`],[`Greg Diment`,`Sportspsykologisk konsulent, faglig leder`,`2175-7973`,`gmdi@teamdanmark.dk`]],
related:[[`Styrketræning`,`Sådan tilpasser du styrketræningen til dit mål.`,`Styrketræningens indhold`],[`Periodisering`,`Planlæg, så formen topper på det rigtige tidspunkt.`],[`SoMe og præstationsevne`,`Når sociale medier giver mental træthed.`],[`Højderum`,`Seks højderum i Idrættens Hus i Brøndby.`]]},

'Kvindelige atleter og hormonel status':{expertsH:`Yderligere information`,key:`kv3`,title:`Kvindelige atleter og hormonel status`,
lead:`Den hormonelle cyklus og fx brug af p-piller kan påvirke præstationsevne, tilpasning til træning og risiko for skader.`,
blocks:[
['h2',`To ting, du skal vide`],
['p',`Der er de senere år kommet mere fokus på kvindens hormonelle cyklus i sport, både i forskningen og blandt atleter. Som eliteatlet skal du især være opmærksom på to ting.`],
['cards',[[`01`,`Brug en individuel tilgang`,`Effekten af den hormonelle status er i de fleste tilfælde begrænset og varierer fra atlet til atlet. Det, du gør, skal tage afsæt i din sport og din baggrund.`],[`02`,`Ignorér ikke udebleven menstruation`,`Udebleven menstruation over længere tid kan skade både din præstationsevne og din sundhed og øger især risikoen for skader på knoglerne.`]]],
['h2',`Et frit valg på et oplyst grundlag`],
['p',`Valg af fx prævention er altid frit og personligt, og det skal træffes på et så oplyst grundlag som muligt. Der er ofte både fordele og ulemper ved fx p-piller eller hormonspiral, og alle lægemidler kan give bivirkninger.`],
['h2',`Spørgsmål og svar`],
['faq',[[`Hvordan påvirkes træningsudbyttet?`,`Den naturlige cyklus kan muligvis tænkes ind i træningsplanlægningen, især i styrke- og powertræning, men der er brug for flere studier. Udbyttet påvirkes muligvis lidt af p-piller, og påvirkningen kan være både positiv og negativ.`],[`Hvordan påvirkes præstationsevnen?`,`I gennemsnit er der ingen eller kun små forskelle i løbet af cyklus, både med og uden prævention. Fra ægløsning til blødning kan temperaturreguleringen være påvirket, så der kan være grund til ekstra fokus på køling, væske, varmetræning og pacing i varme og fugtige forhold.`],[`Hvordan påvirker menstruationsgener træningen?`,`Perioden op til og omkring blødning kan give ubehag og gøre nogle atleter mindre klar til træning og konkurrence. Tag det med i dialogen mellem atlet og træner.`],[`Øges risikoen for skader?`,`Har du længe haft udebleven menstruation, falder knoglestyrken, og risikoen for brud stiger. Med en naturlig cyklus kan der være øget risiko for korsbåndsskader omkring ægløsning. P-piller kan muligvis mindske den risiko, men kan også give bivirkninger som øget psykisk sårbarhed og en lille øget risiko for blodpropper.`]]],
['h2',`En individuel tilgang`],
['p',`Er du nysgerrig på, om hormonelle udsving påvirker din træning eller præstation, skal du altid tage udgangspunkt i dig selv. Se først på de områder, hvor du får mere ud af en indsats: træningen, kost, væske og søvn og de tekniske og mentale sider af sporten.`],
['p',`Det er også svært at måle cyklus præcist, fordi den varierer fra atlet til atlet og fra måned til måned. Du er velkommen til at søge rådgivning hos Team Danmark, hvor vi tager udgangspunkt i din situation.`],
['h2',`Udebleven menstruation skal ikke ignoreres`],
['p',`Der kan være flere årsager til, at menstruationen udebliver. I elitesport kan et for lille energiindtag i forhold til træningsmængden være en af dem, såkaldt relativ energimangel (REM-S). Årsagen skal udredes, så cyklus så vidt muligt bliver regelmæssig igen.`],
['key',`Det skal du gøre`,`Udebliver din menstruation i en længere periode, så søg sparring hos Team Danmark, din læge eller en anden sundhedsfaglig person. Det gælder også, hvis du er træner for en atlet, der fortæller om det.`],
['dl',`Videnskabeligt overblik`,`Team Danmarks eksperter har samlet pointerne og uddybet dem i et populærvidenskabeligt overblik.`,`Læs og download`]],
people:[[`Peter Møller Christensen`,`Sportsfysiolog`,`2712-1998`,`pmch@teamdanmark.dk`],[`Majke Jørgensen`,`Ernæringsfysiolog`,`2530-5907`,`majo@teamdanmark.dk`],[`Christoffer Brushøj`,`Læge`,`2729-2068`,`chbr@teamdanmark.dk`]],
related:[[`Styrketræning`,`Sådan tilpasser du styrketræningen til dit mål.`,`Styrketræningens indhold`],[`Restitution`,`Det, der gør kroppen klar til ny træning.`],[`Periodisering`,`Planlæg, så formen topper på det rigtige tidspunkt.`],[`Sportsfysiologi`,`Sådan arbejder vores sportsfysiologer.`]]},

'SoMe og præstationsevne':{key:`so3`,title:`SoMe og præstationsevne`,
lead:`Aktivitet på sociale medier øger mental træthed og kan påvirke både din præstationsevne og dit udbytte af træningen.`,
blocks:[
['h2',`Mental træthed sænker præstationen`],
['p',`Mental træthed har stor negativ betydning for præstationsevnen. Når adenosin hober sig op, og dopamin falder i hjernen, føles anstrengelsen større, og motivationen falder. Du får lettere ondt af dig selv og bliver mindre motiveret til at præstere.`],
['p',`Et forsøg har fx vist, at brug af sociale medier giver markant mere mental træthed end at se tv.`],
['h2',`Det viser forsøgene`],
['tiles',`Påviste negative effekter af SoMe før træning`,[[`Yoyo-test`,`15 % lavere præstation`],[`Tre sæt squat`,`30 % mindre træningsload, mod 15 % uden SoMe`],[`Otte ugers svømmetræning`,`Ingen fremgang på 100 og 400 m fri, når atleterne brugte SoMe 30 min. før hver træning`]]],
['p',`Sociale medier er kun en af de ting, der giver mental træthed. Det kan også skyldes for lidt søvn eller for meget hovedarbejde.`],
['h2',`Sådan modvirker du mental træthed`],
['p',`Tænk over, hvornår og hvor meget du er på sociale medier. Der er også flere praktiske ting, du kan gøre:`],
['cards',[[`Timing`,`Undgå SoMe 2 timer før`,`Hold dig fra sociale medier 2 timer før træning, konkurrence og søvn. Det mindsker den akutte træthed og skærper fokus.`],[`Koffein`,`Bloker trætheden`,`Koffein blokerer adenosin-receptorerne i hjernen og mindsker oplevelsen af træthed. Det kan være kaffe, energidrik eller tyggegummi.`],[`Performance-lur`,`Sov 20 minutter`,`En kort lur på 20 minutter kan forbedre præstationen og mindske træthed.`],[`Mindfulness`,`Træn din opmærksomhed`,`Mindfulness kan give mere mental klarhed og mindske stress og træthed.`]]],
['h2',`En middagsrutine på en træningsdag`],
['steps',[`Maks. 1 time SoMe`,`Frokost`,`Kaffe`,`10-15 minutters mindfulness`,`20 minutters performance-lur`]],
['p',`Med den rutine kan du passe dine sociale medier og samtidig undgå mental træthed. Den sætter dig også godt op til eftermiddagens træning.`]],
people:[[`Lars Johansen`,`Sportsfysiolog`,`2163-5425`,`lajo@teamdanmark.dk`],[`Christina Øyangen Ørntoft`,`Sportsfysiolog, faglig leder`,`2818-3425`,`coor@teamdanmark.dk`]],

'Højderum':{key:`hr3`,title:`Højderum`,
lead:`Team Danmark har seks højderum og et opholdsrum i Idrættens Hus i Brøndby. Faciliteterne kan bruges af atleter og til forskning.`,
blocks:[
['tiles',`Højderummene i tal`,[[`Dobbeltværelser`,`6`],[`Simuleret højde`,`Op til 3500 m`],[`Opholdsrum`,`1, også til træning`]]],
['p',`Højderummene er etableret med en donation fra Novo Nordisk Fonden. Opholdsrummet bruges også som socialt rum, og du kan træne der.`],
['h2',`Sådan kan du bruge højderummene`],
['faq',[[`Find ud af, hvor følsom du er for højde`,`Det er meget forskelligt, hvor meget fx 2000 meters højde påvirker kroppen. Vi kan måle iltmætningen i dit blod i hvile og under arbejde, så du kan lægge en strategi før et ophold i højden.`],[`Vænn dig til højden`,`Kan du ikke ankomme cirka en uge før en konkurrence i højden, kan du akklimatisere hjemmefra. Allerede efter få døgn sker der tilpasninger, der mindsker gener som hovedpine og forbedrer præstationsevnen.`],[`Simulér konkurrencen`,`Afprøv, hvor meget højden påvirker dig, så du kan tilpasse taktik og pacing. Gør det helst efter mindst 5-7 dages akklimatisering.`],[`Øg blodets hæmoglobinmasse`,`Vil du øge hæmoglobinmassen uden at forlade Danmark, skal du bruge så mange af døgnets timer som muligt i højderummet og samtidig passe din træning, uddannelse og dit job. Se minimumsdosis herunder.`],[`Hold fast i effekten fra højdetræning`,`En stigning i hæmoglobinmasse forsvinder efter cirka 2 uger ved havniveau. Er du hjemme mellem en højdetræningslejr og fx et EM eller VM, kan højderummet hjælpe dig med at holde effekten. Varmetræning kan give en lignende effekt, og rækkefølgen afhænger af, hvor du skal konkurrere.`],[`Øg træningsstresset`,`I tynd luft giver samme belastning mere stress for muskler og kredsløb. Har du en mindre skade, kan træning i højden mindske tabet af form. Gentaget sprinttræning i tynd luft ser også ud til at give bedre tilpasninger.`]]],
['h3',`Minimumsdosis for at øge hæmoglobinmassen`],
['ul',[`Mindst 3 uger i alt`,`Mere end 10 timer i højden om dagen, dog ikke over 3500 m`,`Mere end 700 kilometertimer i alt, fx 12 timer dagligt i 2200 m i 4 uger`,`En blodprøve først, så du ikke mangler jern`,`Start i 2000 m, og øg med 200-400 m om ugen`]],
['p',`Planen aftales med en sportsfysiolog fra Team Danmark. Iltmætningen måles løbende, og målet er en hvilemætning under 95 procent. Du går som udgangspunkt ikke over 3000 m, fordi søvn og restitution ofte bliver dårligere.`],
['h2',`Før du bruger højderummene`],
['p',`Højderummene er et avanceret supplement og ikke en genvej. For atleter gælder det, at:`],
['ul',[`Du arbejder stabilt og professionelt med træning, restitution og ernæring.`,`Brugen bygger på en faglig vurdering fra dit forbund og Team Danmarks eksperter og indgår i din sæsonplan.`,`Du er rask. Fortæl din sportsfysiolog og dit forbund om infektioner, nylig sygdom eller hjerte-kar-sygdom.`,`Du siger til, hvis du får gener som hovedpine, dårlig appetit eller dårlig søvn.`,`Du følger den aftalte plan for timer og højde.`,`Du dokumenterer højde og timer per dag, som Anti Doping Danmark anbefaler.`]],
['key',`Stop opholdet`,`Får du brystsmerter, uventet åndenød, hjertebanken, svær svimmelhed, besvimelse eller markant hovedpine, skal du stoppe opholdet og tale med en læge, før du fortsætter.`],
['p',`Det er dit eget valg at bruge højderummene, og ansvaret er dit. Team Danmarks ulykkes- og ansvarsforsikring dækker indplacerede atleter i et nærmere beskrevet omfang. Forskere skal have en gyldig etisk godkendelse af deres forsøgsprotokol.`],
['h2',`Sådan virker rummene`],
['p',`Ilten filtreres fra luften, så den svarer til 5700 m, og blandes derefter med rumluft, til den ønskede højde er nået. Det tager cirka 2,5 timer at nå 2500 m og 3,5 timer at nå 3500 m.`],
['p',`Hvert rum har to iltmålere, der slår alarm, hvis iltniveauet bliver for lavt, og du får også en personlig måler med alarm. Luften udskiftes, så kuldioxid holdes under 2000 ppm i hvile. Rummene er leveret af Sporting Edge, UK.`],
['dl',`Referenceliste`,`Den litteratur om højdetræning, som siden bygger på.`,`Læs og download`]],

function artBlock(b,st2){
