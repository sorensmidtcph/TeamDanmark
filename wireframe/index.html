const ARTK={
'Kost':{...KO_BASE,key:`ko3`,title:`Kost`,related:koRel(`Kost`),
lead:`Kosten er afgørende for din sundhed og din præstationsevne. Få styr på dit energibehov, og på hvad din kost skal indeholde i forhold til din vægt og træning.`,
blocks:[
['h2',`Planlæg din kost`],
['p',`Når du planlægger din kost, kan du få mere ud af din træning. Det kræver, at du spiser varieret, får nok energi og næringsstoffer og planlægger dine måltider efter træningen.`],
['p',`Kosten er afgørende for, at kroppen kan restituere og præstere, og for at du kan holde en god kropssammensætning. Den er også med til at forebygge skader og sygdom.`],
['h2',`Energi, næring og præstation`],
['p',`Sportsgrene stiller forskellige krav, så din kost skal passe til dig. Dit behov for næringsstoffer afhænger af, hvor meget og hvor hårdt du træner, og af din alder, dit køn, din vægt og din kropssammensætning. Kroppen skal have mulighed for at reparere musklerne og fylde energidepoterne op til næste træning.`],
['cards',[[`Værktøj`,`Energiberegner`,`Beregn, hvor meget energi din krop har brug for, efter hvor meget og hvor hårdt du træner.`],[`Værktøj`,`Væsketest`,`Find ud af, hvor meget du skal drikke før, under og efter træning og konkurrence.`]]],
['h2',`Spis varieret`],
['ul',[`Prøv nye madvarer og opskrifter.`,`Spis efter årstiden, det giver variation.`,`Varier dine kulhydratkilder (ris, pasta, kartofler, brød) og proteinkilder (kød, fjerkræ, fisk, æg, mejeriprodukter, bælgfrugter).`,`Spis mindst 200-300 gram fisk om ugen, gerne fede fisk som sild, laks og makrel.`,`Få så vidt muligt alle fødevaregrupper med, og find erstatninger, hvis du udelukker nogle.`,`Spis frugt eller grønt til alle hoved- og mellemmåltider.`]],
['h3',`Spis efter regnbuen`],
['p',`Farverne i frugt og grønt viser forskellige vitaminer, mineraler og antioxidanter.`],
['tiles',`Frugt og grønt efter farve`,[[`Blå og lilla`,`Blåbær, blommer, rosiner, druer`],[`Rød`,`Tomat, vandmelon, kirsebær, rød peberfrugt`],[`Orange og gul`,`Gulerod, abrikos, appelsin, mango`],[`Grøn`,`Broccoli, salat, grønne æbler`],[`Hvid`,`Blomkål, banan, løg, kartofler`]]],
['h2',`Kostrammer`],
['p',`Kostrammerne er forslag til, hvad du kan spise for at ramme dit energibehov ud fra køn, vægt og træningsmængde.`],
['table',`Kostrammer efter energimængde`,[`Kostramme`,`Kalorier`,`Kilojoule`],[[`Kostramme 1`,`2.300-2.800 kcal`,`9.500-11.500 kJ`],[`Kostramme 2`,`2.900-3.400 kcal`,`12.000-14.000 kJ`],[`Kostramme 3`,`3.500-4.000 kcal`,`14.500-16.500 kJ`],[`Kostramme 4`,`4.100-4.600 kcal`,`17.000-19.000 kJ`],[`Kostramme 5`,`4.700-5.200 kcal`,`19.500-21.500 kJ`]]],
['dl',`Kostrammer 1-5`,`Alle fem kostrammer som pdf.`,`Download`],
['h2',`En god energibalance`],
['p',`Energidepoterne er med til at bestemme fedt- og muskelmasse og giver kroppen brændstof. Mange atleter prøver at styre energiindtaget for at ændre vægt, fedtmasse eller muskelmasse. Det kræver omtanke:`],
['ul',[`Sæt kostmål, der passer til din sport.`,`Mål det rigtige, og skeln mellem ændringer i væske, fedtmasse og vægt.`,`Et for lavt energiindtag påvirker kroppens funktioner, fx stofskiftet og menstruationscyklus.`,`Vægt og kropssammensætning skal altid vurderes individuelt.`,`Bestem din konkurrencevægt, når du er rask og præsterer på dit bedste.`,`En individuel kostplan kan være bedre end at spise efter appetit eller det, der er.`,`Vurder ikke energibalancen ud fra vægten alene.`]],
['key',`Vær opmærksom`,`I forsøget på at optimere vægt og kropssammensætning kan nogle atleter udvikle et forstyrret forhold til kosten. Både atleter, trænere og ledere skal være opmærksomme på tegn på forstyrret spisning.`],
['btn',`Læs om spiseforstyrrelser`,`Spiseforstyrrelser`],
['h2',`Vegetar og eliteatlet`],
['p',`Du kan godt være vegetar eller veganer og præstere på topniveau. Vær dog ekstra opmærksom på to ting:`],
['cards',[[`Energi`,`Spis nok`,`Vegetariske og veganske måltider har ofte færre kalorier. Tilpas dit energiindtag til dit forbrug.`],[`Næringsstoffer`,`Få dækket dit behov`,`Hold øje med essentielle aminosyrer, jern, calcium, D-vitamin, B12, zink og omega-3. De er vigtige for muskler, knogler og iltoptag.`]]],
['dl',`Kost og elitesport`,`Team Danmarks guide til den bedste fordeling af næringsstoffer i din kost.`,`Se guiden`]]},

'Væske':{...KO_BASE,key:`vae3`,title:`Væske`,related:koRel(`Væske`),
lead:`Har du styr på dit væskebehov? Her får du anbefalinger om, hvad og hvor meget du skal drikke før, under og efter træning og konkurrence.`,
blocks:[
['h2',`Derfor betyder væske noget`],
['p',`Når du sveder, regulerer kroppen sin temperatur. Du kan svede over 2 liter i timen, og drikker du for lidt, kan du blive dehydreret og overophedet. Det kan sænke din præstationsevne.`],
['tiles',`Hvornår dehydrering påvirker mest`,[[`Varighed`,`Lange udholdenhedspræstationer påvirkes mere end korte`],[`Varme`,`Dehydrering påvirker mere i varme forhold`],[`Fart`,`Langsomme discipliner påvirkes mere, fordi der er mindre vindkøling`]]],
['key',`Tommelfingerregel`,`Et vægttab på op til 2 procent, mest fra væske, påvirker i de fleste tilfælde ikke præstationen nævneværdigt. Hold dig under det i træning og konkurrence.`],
['h2',`Hvor meget skal du drikke?`],
['ul',[`Det er individuelt. Team Danmark-atleter kan få hjælp til en væsketest og vejledning bagefter.`,`Det er ikke nødvendigvis målet at være 0 procent dehydreret efter konkurrence, men i varme forhold er risikoen større.`,`Drik ikke mere, end du sveder. Det giver ingen fordel at tage på i vægt under træning.`,`Kroppen kan højst optage 1000-1200 ml væske i timen.`]],
['h2',`Mere end vand`],
['cards',[[`Kulhydrat`,`30-90 gram i timen`,`Træner du mere end 60 minutter, så du bliver udmattet, så indtag 30-90 gram kulhydrat i timen. Det holder blodsukker, fart og koncentration oppe. Lad ikke fruktose være den vigtigste sukkerart, da det kan give maveproblemer.`],[`Salt`,`Erstat dit salttab`,`Nogle atleter taber 3-4 gram salt på 1-2 timers træning. Salt binder væsken, så du hurtigere bliver rehydreret. Tag en sort bomuldstrøje på til træning: er der saltkrystaller bagefter, er du saltsveder.`]]],
['h2',`Rehydrering efter træning`],
['p',`Det er vigtigt for din restitution at erstatte væske og salt efter træning. Målet er at drikke 1,2-1,5 liter for hvert kilo, du har tabt. Spiser du ikke samtidig, skal væsken indeholde salt, fx en sportsdrik med elektrolytter. Sveder du meget, kan du drysse lidt ekstra salt på dit måltid.`],
['key',`Husk`,`Test altid din væske- og kulhydratstrategi i træning, før du bruger den i konkurrence.`],
['h2',`Lav din egen væsketest`],
['p',`Start velhydreret. Tisser du mindre end normalt, eller er urinen mørkere, end den plejer, drikker du sandsynligvis for lidt. Drik lidt og ofte gennem dagen. Sådan måler du dit væsketab:`],
['steps',[`Vej dig i undertøj før et træningspas på mindst en time`,`Notér træningstid, temperatur og evt. luftfugtighed`,`Tør dig og vej dig igen inden for 10 minutter efter træning`,`Registrér, hvad du drikker og spiser under træning`,`Registrér vægtændringen, hvis du går på toilettet`]],
['p',`Testen viser dit væsketab i timen, om du drikker nok, og hvor meget du skal drikke bagefter. Husk, at en times hårdt arbejde også kan forbrænde 300 gram sukker fra musklerne.`],]},

'Kosttilskud':{...KO_BASE,key:`kt3`,title:`Kosttilskud`,related:koRel(`Kosttilskud`),
people:[[`Majke Jørgensen`,`Ernæringsfysiolog, faglig leder`,`2530-5907`,`majo@teamdanmark.dk`],[`Cecilie Refsgaard`,`Ernæringsfysiolog`,`3027-8937`,`crol@teamdanmark.dk`],[`Peter Møller Christensen`,`Sportsfysiolog`,`2712-1998`,`pmch@teamdanmark.dk`]],
lead:`Kosttilskud flytter ikke en atlet fra nummer 100 til medaljeskamlen. Men brugt rigtigt kan nogle kosttilskud rykke marginaler.`,
blocks:[
['key',`Først træning, kost og restitution`,`Team Danmark opfordrer til, at du optimerer din træning, kost og restitution, før du bruger kosttilskud. Overvejer du et tilskud, så søg kompetent vejledning.`],
['h2',`Seks trin før du bruger et kosttilskud`],
['p',`Gå de seks trin igennem, så du kan vurdere, om et kosttilskud er relevant og frem for alt sikkert.`],
['faq',[[`1. Er det lovligt?`,`Det er altid dit eget ansvar, at du ikke indtager produkter, der står på dopinglisten.`],[`2. Er der videnskabelig evidens?`,`Team Danmark anbefaler kun produkter med dokumenteret effekt, som kan indtages uden sundhedsmæssige risici.`],[`3. Er det renhedstestet?`,`Køb kun renhedstestede produkter. Så mindsker du risikoen for et produkt, der er forurenet med forbudte stoffer.`],[`4. Integritet og etik`,`Kosttilskud er altid et personligt valg og et supplement, du kan vælge på et oplyst grundlag. Anbefalingerne bygger på eliteidrættens værdier og Etisk kodeks for dansk konkurrenceidræt.`],[`5. Individuel afprøvning`,`Atleter reagerer forskelligt. Få en individuel plan med professionel vejledning, afprøv altid tilskuddet i træning før konkurrence, og mål effekten, hvis du kan.`],[`6. Implementering`,`Har du set en positiv effekt, kan du prøve tilskuddet i konkurrence. Husk, at en effekt i test eller træning ikke altid kan overføres direkte til konkurrence.`]]],
['video',`Video: Sportsfysiolog Peter Møller Christensen om, hvornår det er relevant for en eliteatlet at tage kosttilskud.`],
['h2',`Læs mere`],
['cards',[[`Anvendelse`,`Hvilke kosttilskud og hvornår`,`Kosttilskuddene opdelt efter hvornår de bruges, med hvilket formål og til hvilke atleter.`],[`Anskaffelse`,`Køb renhedstestet`,`Sådan mindsker du risikoen for en positiv dopingtest, når du køber kosttilskud.`]]]]},

'Kropskomposition og vejning':{...KO_BASE,key:`kk3`,title:`Kropskomposition og vejning`,related:koRel(`Kropskomposition og vejning`),
lead:`Vægt og kropssammensætning kan have betydning for præstationen. Her er Team Danmarks anbefalinger om vejning, og om hvordan man taler om vægt på en god måde.`,
blocks:[
['h2',`Sådan taler du om vægt`],
['p',`Team Danmark anbefaler, at alle, der arbejder med atleter, er opmærksomme på det her, når de taler om vægt og kropssammensætning.`],
['cards',[[`Fokus på`,`Det, der gør atleten bedre`,`Se på hele atleten, hvor vægt kun er én af mange faktorer. Hav altid et formål med en måling. Skab de bedste betingelser for at præstere og restituere, følg op og tilbyd en samtale, og fortæl atleten, hvor der er hjælp at hente.`],[`Undgå at`,`Gøre vægten til et emne`,`Sammenligne med andre atleter, tale om vægten, så andre hører det, eller vise den på skrift. Bruge humor, ironi eller stikpiller om vægt, fokusere kun på udseende og kommentere madvalg og mængder.`]]],
['p',`Team Danmark anbefaler, at specialforbundene laver deres egne retningslinjer for vejning og måling sammen med Team Danmarks fageksperter.`],
['dl',`Anbefalinger om vægt og kropssammensætning`,`Sådan taler du om vægt og krop.`,`Download pdf`],
['h2',`Retningslinjer for vejning`],
['p',`Skal en atlet vejes, skal det håndteres rigtigt, og atleten skal være tryg ved det. Vejning bør kun foretages af personer med sundhedsfaglige kompetencer.`],
['key',`Under 18 år`,`Som udgangspunkt anbefaler Team Danmark, at atleter under 18 år ikke vejes. Undtagelser kan være ved test og slutrunder, hvor formålet er at følge væsketabet.`],
['h3',`Det skal være på plads`],
['ul',[`Målingen har et formål, og atleten er informeret og har givet samtykke.`,`Data behandles fortroligt.`,`Målingen sker i et privat rum og i trygge rammer.`,`Samme vægt bruges hver gang, på en hård og plan overflade.`,`Atleten vejes på samme tid af døgnet, lige efter et toiletbesøg og i det samme tøj.`]],
['h3',`Sådan foregår vejningen`],
['steps',[`Spørg, om atleten er okay med målingen`,`Spørg, om atleten har spørgsmål`,`Lad atleten selv vælge, hvilket tøj der tages af`,`Sig kun tallet højt, hvis atleten spørger`,`Gem altid data væk efter målingen`]],
['h3',`Måling af kropskomposition`],
['p',`Måling af kropskomposition bør foretages af erfarne sundhedsprofessionelle, gerne ISAK-certificerede, og suppleres med en måling af væskestatus. Bagefter skal atleten vide, hvor der er information og hjælp at hente.`],
['dl',`Retningslinjer for vejning`,`Team Danmarks retningslinjer samlet i én pdf.`,`Download pdf`]]},

'Spiseforstyrrelser':{...KO_BASE,key:`sf3`,title:`Spiseforstyrrelser og eliteidræt`,related:koRel(`Spiseforstyrrelser`),
lead:`Vægt og kropssammensætning betyder meget i mange sportsgrene, og nogle atleter udvikler et forstyrret forhold til kosten.`,
blocks:[
['h2',`Hvad skal du være opmærksom på?`],
['p',`Som eliteatlet skal du være opmærksom på, om du selv eller nogen omkring dig viser tegn på forstyrret spisning eller tidlige tegn på en spiseforstyrrelse. Har du mistanke, er det vigtigt at tale om det og vide, hvor der er hjælp at hente.`],
['p',`Er du træner, leder, forælder eller en anden ressourceperson, så vær informerende og ikke-dømmende. Reagér, så snart en atlet begynder at fokusere for meget på mad, vægt og krop. Jo tidligere det bliver opdaget, desto lettere er det at vende.`],
['key',`For Team Danmark-atleter og trænere`,`Siden er målrettet Team Danmark-atleter og trænere og ressourcepersoner i de forbund, Team Danmark samarbejder med. Generelle råd til alle i dansk idræt finder du hos DIF.`],
['h2',`Ved moderat eller høj risiko`],
['ol',[`Tal med atleten om det, du har observeret.`,`Tilbyd atleten en samtale med en sportsdiætist, der kan se på energi, kostvaner, jernstatus og evt. knogletæthed og tale om stress omkring mad, vægt og krop.`]],
['cards',[[`Moderat risiko`,`Træn med en plan`,`Atleten kan deltage i træning og konkurrence, når det sker efter en superviseret trænings- og kostplan.`],[`Høj risiko`,`Overvej konkurrencerne`,`Konkurrencedeltagelse bør overvejes, og træning og kostplan bør superviseres.`]]],
['p',`I begge tilfælde bør der være en løbende tværfaglig dialog med landstræner, sportschef, sportsdiætist, psykolog og læge.`],
['h2',`Sådan kan du forebygge`],
['p',`Sportsgrene har forskellige kulturer og normer om vægt, krop og udseende. Det nære miljø, holdkammerater og idoler påvirker atleternes valg. Både trænere og atleter skal vide, at vægt og krop kan være følsomme emner, især for unge i puberteten.`],
['h2',`Relativ energimangel i sport (REM-S)`],
['p',`REM-S opstår, når du indtager for lidt energi i forhold til, hvad du forbruger. Så er der ikke energi nok til de funktioner i kroppen, der holder dig sund og præstationsklar, og det kan gå ud over både din fysiske og psykiske sundhed.`],
['h2',`Hjælp og materialer`],
['dl',`Spiseforstyrrelser i sport`,`Folder om symptomer, og om hvordan du hjælper en atlet til en sund balance.`,`Download folder`],
['dl',`E-læring fra DIF`,`Gratis kursus om spiseforstyrrelser til bl.a. trænere og forældre.`,`Tag kurset`],
['dl',`Team Danmarks procedure`,`Sådan henviser Team Danmark støttede atleter til en ekstern klinisk psykolog med fuld fortrolighed.`,`Download procedure`]]},

'Røgfri nikotin og elitesport':{...KO_BASE,key:`rn3`,title:`Røgfri nikotin og elitesport`,related:koRel(`Røgfri nikotin og elitesport`),
lead:`Snus, nikotinposer og andre røgfri nikotinprodukter kan have negativ effekt på både præstation, restitution og sundhed.`,
blocks:[
['h2',`Ikke et harmløst alternativ`],
['p',`Mange tror, at røgfri nikotin er harmløst eller kan forbedre præstationen og hjælpe mod stress. Men det har dokumenterede skadelige effekter på både den mentale og den fysiske præstation.`],
['p',`Nogle oplever, at de bliver mere fokuserede, men forskningen viser, at det mest gælder dem, der allerede er afhængige. Samlet set er konsekvenserne for præstation, restitution og sundhed negative.`],
['h2',`5 gode grunde til at droppe røgfri nikotin`],
['steps',[`Det forbedrer ikke din præstation, men kan forringe din fysik og dit fokus`,`Det stresser dit hjerte med højere puls og blodtryk`,`Du bliver hurtigere afhængig, end du tror`,`Det går ud over din søvn og restitution`,`Du sætter din sundhed på spil, fra tandkød til angst og depression`]],
['key',`Vil du stoppe?`,`Du er altid velkommen til at kontakte en af Team Danmarks ernæringsfysiologer. Du kan også få hjælp hos Sundhedsstyrelsens Stoplinien på stoplinien.dk.`],
['h2',`Fakta om nikotin og elitesport`],
['faq',[[`Hjerte og kredsløb`,`Nikotin øger puls og blodtryk og belaster hjerte og kar. Iltmætningen i muskler og hjerne stiger, men det giver ikke bedre præstation eller længere tid til udmattelse ved høj intensitet.`],[`Fokus og koncentration`,`Følelsen af skarphed skyldes mest, at abstinenserne lindres hos dem, der er afhængige. Hos ikke-brugere kan nikotin give rastløshed og nervøsitet og forringe koncentrationen.`],[`Muskler og energi`,`Nikotin har ingen entydig effekt på muskelstyrke. Det kan muligvis hæmme musklernes energiproduktion, men betydningen i elitesport er uklar.`],[`Afhængighed`,`Nikotin er stærkt vanedannende. Du risikerer at blive afhængig for at have et normalt niveau af fokus og velvære, og det kan forstyrre din søvn og restitution.`],[`Sundhed`,`Snus og nikotinposer kan skade tandkød og mund, øge risikoen for angst og depression, særligt hos unge, og muligvis øge risikoen for stofskiftesygdomme på sigt.`]]],
['h2',`Det kan trænere og klubber gøre`],
['cards',[[`Rollemodel`,`Gå forrest`,`Lad være med at bruge nikotinprodukter i sportsmiljøet.`],[`Viden`,`Oplys atleterne`,`Tag nikotin med i klubbens retningslinjer for en sund livsstil.`],[`Stress`,`Vis alternativer`,`Introducér mental træning, åndedrætsteknikker og mindfulness.`],[`Støtte`,`Hjælp med at stoppe`,`Tilbyd støtte til at trappe ned, evt. sammen med sundhedsprofessionelle.`]]]]}
};

regArt(`Mental træning & trivsel`,1,SP_PEOPLE,{
'Mindfulness':{title:`Mindfulness`,lead:`Mindfulness er et redskab til at være fuldt til stede i den aktuelle opgave, så du kan præstere optimalt.`,blocks:[
['p',`Træning af opmærksomheden er en central del af mentaltræningen for en eliteatlet. Mindfulness er et redskab til at skærpe din opmærksomhed og fokusere på det aktuelle øjeblik.`],
['p',`Team Danmark har udviklet en række mindfulness-øvelser, der er relevante for atleter, fra træning af åndedrættet til præstationsspecifikke visualiseringer.`],
['key',`Husk`,`Der er ikke noget rigtigt eller forkert i mindfulness. Det er individuelt, hvad du mærker, og hvilke øvelser der virker bedst for dig. Jo mere du træner, desto bedre resultater.`],
['h2',`Åndedræts- og afspændingsøvelser`],
['p',`Systematisk træning af vejrtrækningen, din tilstedeværelse og din kropslige tilstand har positiv effekt på både din fysiske og din psykiske sundhed.`],
['ul',[`Åndedræts- og nærværsøvelser`,`Bodyscan`,`Progressiv muskelafspænding`]],
['h2',`Visualiseringer`],
['p',`Visualiseringer kan påvirke både krop og følelser, når du trænger til ro eller skal finde balancen igen i et travlt eliteliv.`],
['ul',[`Blade i et vandløb`,`Et roligt sted`,`Tanker som skyer`]],
['h2',`Præstationsspecifikke øvelser`],
['p',`Øvelserne gør dig klogere på, hvilken atlet du gerne vil være, og hvordan du viser mental styrke under pres. De kræver, at du kender dine værdier og dine udfordringer under pres, så start med at arbejde med dine værdier og mestringsstrategier.`],
['ul',[`Optakt til en vigtig præstation`,`Evaluering af en vigtig præstation`,`Afslutningsreceptionen`,`Mental styrke`]],
['dl',`Team Danmarks mindfulness-øvelser`,`Lyt til øvelserne, og læs, hvordan du kommer godt i gang.`,`Lyt til øvelserne`],
['h2',`Faldgruber ved mindfulness`],
['faq',[[`Du falder i søvn`,`Mange falder i søvn under en meditation, og det er ikke meningen. Du skal sidde vågen og opmærksom med en afslappet krop, og det tager tid at lære. Den lange bodyscan kan dog bruges til at falde i søvn på, da den netop er en søvnmeditation.`],[`Resultatet udebliver`,`Er du meget resultatorienteret, så prøv at give slip på det, når du mediterer. Aftal med dig selv at meditere hver dag i fx fire uger, og mærk så efter, om det har virket.`],[`Du vurderer din meditation`,`Mange stopper, når de ikke kan koncentrere sig, og kalder det en dårlig meditation. Men der findes kun gode meditationer, for meningen er at registrere og undersøge, hvad der sker lige nu.`]]]]},
'Compassion':{title:`Compassion`,lead:`Læs om compassion i elitesport, og prøv øvelser, der er udviklet til at fremme både trivsel og præstation.`,blocks:[
['p',`Compassion er et relativt nyt begreb i elitesport. Det er et redskab til at fremme præstation og trivsel på én gang. Det tager hensyn til hjernens behov for balance og tryghed, men har samtidig fokus på at stille krav, udfordre og levere resultater.`],
['p',`Compassion er bygget op om tre flows, som alle er lige vigtige og skal udvikles på samme tid:`],
['steps',[`At kunne give compassion til andre`,`At kunne modtage compassion fra andre`,`At kunne give compassion til dig selv (self-compassion)`]],
['h2',`Compassion er en færdighed, du kan træne`],
['p',`Er du ny i compassiontræning, så tag øvelserne i rækkefølge, fordi de senere øvelser bygger på erfaringerne fra de første. Lyt til introduktionen første gang, du laver en øvelse.`],
['p',`Træn gerne compassion hver dag. Det kræver vedholdenhed, og du mærker ikke nødvendigvis den store forandring med det samme. Den kommer over tid.`],
['dl',`Team Danmarks compassion-øvelser`,`Øvelser rettet mod alle tre flows.`,`Lyt til øvelserne`],
['h2',`Compassion og hjernen`],
['p',`Compassion bliver ofte misforstået som noget blødt, der ikke hører hjemme i elitesport. Men det handler om at have din egen og andres trivsel for øje og have visdom og mod til at træffe de rigtige beslutninger, også de svære. Hjernen kan groft sagt deles op i tre følelsesregulerende systemer.`],
['cards',[[`Alarmknappen`,`Trusselssystemet`,`Vores stærkeste system. Det får os til at kæmpe, flygte eller fryse, når vi møder en fare, og skal beskytte os.`],[`Drive`,`Motivationssystemet`,`Ønsket om at opnå noget og blive bedre, fx jagten på medaljer, succes eller ros.`],[`Ro`,`Det beroligende system`,`Hjælper os med at føle os forbundet og skifte fra at gøre til at være. Et præstationsfrit rum, hvor vi er trygge.`]]],
['p',`I elitesport tror vi ofte, at vi er i motivationssystemet. Men ofte er vi lige så meget i trusselssystemet, fx når vi frygter ikke at være gode nok. Samtidig glemmer vi det beroligende system, som skal sikre en mere bæredygtig karriere. Når du træner compassion, giver du hjernen bedre betingelser for at restituere og reflektere.`]],P:[2,0,5,4,1,3]},
'Model for mental sundhed':{title:`Model for mental sundhed i elitesport`,lead:`Elitesport handler om mere end at vinde eller tabe. Trænere, ledere, forældre og andre i sportens verden spiller en rolle for udviklingen af mentalt sunde atleter.`,blocks:[
['p',`Mental sundhed handler ikke kun om de få atleter, der mistrives. Det handler om at værne om trivslen for alle. Team Danmark har udviklet en model, der giver overblik over mental sundhed i dansk elitesport.`],
['h2',`Fire niveauer`],
['cards',[[`01`,`Atleten`,`Den enkelte atlet, og hvordan han eller hun oplever livet som eliteatlet.`],[`02`,`Træningsmiljøet`,`Det daglige træningsmiljø på holdet.`],[`03`,`Ledelsen`,`Trænere og sportslig ledelse i miljøet.`],[`04`,`Hverdagslivet`,`Atleternes dagligdag.`]]],
['h2',`Tre farver`],
['tiles',`Modellens farver`,[[`Grøn`,`Trivsel, et sundt miljø, god ledelse og en sammenhængende hverdag`],[`Gul`,`Atleter under pres, et utrygt miljø og en ubalanceret hverdag`],[`Rød`,`Reel mistrivsel, ofte med et skadeligt miljø og farlig ledelse`]]],
['p',`Modellen viser ikke, hvordan det står til i dansk elitesport. Langt de fleste atleter har det godt, og de fleste miljøer er gode. Den viser, hvad der kendetegner mental sundhed, og hvad der påvirker den.`],
['h2',`Tid er et vigtigt perspektiv`],
['p',`Det røde niveau bør aldrig accepteres. Men det er svært at undgå, at atleter og miljøer bevæger sig mellem gul og grøn. Det er okay, så længe perioderne i gul ikke bliver for lange og bliver fulgt af en indsats for at komme tilbage i grøn.`],
['key',`Trivsel og præstation`,`Mental sundhed og gode præstationer følges ofte ad, men det ene giver ikke automatisk det andet. Vi ved dog, at sandsynligheden for gode præstationer, især på den lange bane, stiger med atletens mentale trivsel.`],
['dl',`Model for mental sundhed i elitesport`,`Læs mere i folderen.`,`Download folder`]]},
'Sportspsykologisk netværk':{title:`Sportspsykologisk netværk`,lead:`De sportspsykologiske konsulenter i Team Danmarks eksterne netværk er hver især tilknyttet et af de specialforbund, Team Danmark samarbejder med.`,blocks:[

'Sportspsykologisk filosofi':{title:`Sportspsykologisk filosofi`,lead:`Bliv mentalt rustet til at levere verdensklassepræstationer. Læs om Team Danmarks sportspsykologiske metoder og filosofien bag.`,blocks:[
['p',`Team Danmarks sportspsykologiske arbejde bygger på sportspsykologisk forskning og tager udgangspunkt i anerkendte teorier om, hvordan man skaber forandring.`],
['dl',`Team Danmarks sportspsykologiske filosofi`,`Ydelser, metoder og filosofien bag.`,`Download`],
['h2',`Tanker, følelser og præstationer hænger sammen`],
['p',`Den kognitive psykologi ser på sammenhængen mellem tanker, følelser, fysiologi og adfærd. Vi reagerer ikke på virkeligheden, men på vores fortolkning af den. Bliver en atlet nervøs, er det ikke nødvendigvis, fordi han er overmatchet, men fordi han oplever at være det.`],
['h2',`Al adfærd har en funktion`],
['p',`Selv uhensigtsmæssig adfærd har sekundære gevinster. Presser en nervøs atlet tempoet for højt op i en finale, kan han kortvarigt opleve lettelse, fordi han gør noget, selvom det har en dårlig konsekvens. Sportspsykologien hjælper atleter med at se mønstrene og handle mere hensigtsmæssigt.`],
['h2',`Slip kontrollen med tanker og følelser`],
['p',`Atleter vil ofte gerne kontrollere deres følelser og vende negative tanker til positive. Det kan ikke altid lade sig gøre, især under pres. Når noget er vigtigt for os, er bekymringen en uundgåelig følgesvend, og kæmper vi mod tankerne, har vi mindre fokus på selve kampen.`],
['p',`Med udgangspunkt i mindfulness og Acceptance and Commitment Training (ACT) træner vi atleterne i at være til stede, acceptere ubehagelige tanker og følelser og rette fokus mod opgaven.`],
['h2',`Værdier og drivkraft`],
['p',`På vejen mod verdenstoppen møder atleter de store spørgsmål: Hvem er jeg, og hvad driver mig? Hvilke værdier vil jeg stå for? Er det hele værd? En atlet, der er afklaret om dem, går ofte lettere svære situationer i møde og holder ud i modgang.`],
['h2',`Kommunikation på banen trænes på banen`],
['p',`Effektiv kommunikation giver struktur, gejst, selvtillid, fokus eller ro. Vi gør atleterne bevidste om, hvordan deres adfærd og kommunikation flytter holdet tættere på eller længere fra målet, og tager fat i det konkrete, der sker på banen.`],
['h2',`Organisation og træningskultur`],
['p',`Atleter oplever også stress fra organisationen, fx uklare udtagelseskriterier, medier, uro i ledelsen eller usikkerhed om træningstider og bolig. En god kultur er ofte lig med sammenhæng mellem det, man siger, og det, man gør. Derfor hjælper vi trænere og sportschefer med at afklare værdier, der kommer til udtryk i hverdagen.`],
['h2',`Atletens miljø kan også optimeres`],
['p',`Når hverdagen ikke hænger sammen, skyldes det ofte miljøet uden for sporten. Sportspsykologen ser derfor på hele miljøet og hjælper med at skabe en hverdag med tid til uddannelse, venner og familie, med sporten i centrum.`]]},
'Sportspsykologisk model':{title:`Sportspsykologisk model`,lead:`En række faktorer skal spille sammen, hvis du skal præstere optimalt. Modellen beskriver niveauer, lag og temaer i det sportspsykologiske arbejde.`,blocks:[
['p',`Modellen beskriver, hvilke niveauer, lag og temaer vi tager fat i, når vi arbejder med atleter og trænere om at skabe toppræstationer.`],
['h2',`Atleten i centrum`],
['p',`Modellens centrum er en trekant, der repræsenterer atleten. Den har tre niveauer:`],
['steps',[`Identitet og drivkraft`,`Livet som eliteatlet`,`Mental styrke`]],
['h2',`Miljøet omkring atleten`],
['p',`Cirklen omkring trekanten er det miljø, atleten er en del af: teamet, organisationen og miljøet uden for sporten.`],
['dl',`Team Danmarks sportspsykologiske filosofi`,`Læs meget mere om modellen.`,`Download`]]},
'Sportspsykologisk teammodel':{title:`Sportspsykologisk teammodel`,lead:`Når vi optimerer et teams præstation, handler det både om præstationen, kulturen og trivslen på holdet.`,blocks:[
['p',`Modellen viser de elementer, Team Danmarks sportspsykologer arbejder med. Fokus er præstationen, men den forholder sig også til trivslen, som kan påvirke præstationen.`],
['p',`Et team er to eller flere atleter, der skal præstere sammen, fra en double i badminton til et håndboldhold. En træningsgruppe er også et team, fordi den samarbejder om et fælles mål.`],
['h2',`Hvem er en del af teamet?`],
['cards',[[`Atleter`,`De aktive`,`Senioratleter, stamspillere, nye og perifere atleter og talenter.`],[`Trænere`,`Den sportslige ledelse`,`Cheftræner, assistenttræner, pladsspecifikke trænere og sportschef.`],[`Stab`,`Dem, der støtter`,`Sportspsykolog, fysisk træner, sportsfysiolog, analytiker, ernæringsfysiolog, fysioterapeut, læge, holdleder m.fl.`]]],
['h2',`Kultur er fundamentet`],
['ul',[`Psykologisk tryghed er afgørende for, at teamet kan udvikle sig, trives og lære af hinanden.`,`Klare mål får alle til at arbejde i samme retning.`,`Værdier er det, teamet står for og gerne vil stå for.`]],
['h2',`Klare roller`],
['ul',[`Sportslige roller er opgaver og ansvar knyttet til præstationen.`,`Sociale roller handler om dynamik og trivsel i teamet.`,`Ledelsesroller skal være tydelige, og lederne skal bære teamets værdier og mål.`]],
['h2',`Adfærd`],
['ul',[`Handlinger er alt det, teamets medlemmer gør og udveksler i præstationen.`,`Kommunikation er de rette informationer på de rette tidspunkter og i tråd med teamets værdier.`]],
['dl',`Sportspsykologisk teammodel`,`Modellen som pdf.`,`Download pdf`]]}

const TRAPPE=[['h2',`Genoptræning`],['p',`Et godt genoptræningsforløb hjælper dig hurtigst muligt tilbage. Det afhænger af skadens type og omfang. Muskelskader heler ofte hurtigere end sene- og ledbåndsskader, mens bruskskader kan tage over et år.`],['p',`Tag højde for smerte, hævelse og helingstid, og gå frem trin for trin, så vævet igen kan klare belastningen i sporten.`],['h3',`Trappemodellen`],['p',`Du går et trin op ad trappen, når vævet kan klare belastningen uden flere smerter eller mere hævelse. Får du smerter, går du tilbage til det trin, hvor du sidst trænede uden symptomer.`],['key',`Klar til konkurrence`,`Når du kan gennemføre alle trin og træne konkurrencesituationer uden gener under eller efter træning, heller ikke dagen efter, er du klar til at konkurrere igen.`],['h2',`Smertestillende medicin`],['p',`Har du stadig smerter efter PEACE & LOVE og aflastning, kan du tage paracetamol, fx Panodil, Pinex eller Pamol. Hjælper det ikke, kan du supplere med NSAID, fx Ipren eller ibuprofen.`],['p',`Tag ikke smertestillende for at komme hurtigt i gang med træningen. NSAID kan hæmme effekten af træning, forsinke helingen og give mavesmerter. Behandlingen skal være så kort som muligt, og vil du kombinere medicin, så gør det i samråd med en læge.`]];

['h2',`Opvarmning`],
['p',`En grundig opvarmning forebygger skader og gør kroppen klar til at være aktiv. Den hæver muskel- og kernetemperaturen, øger kredsløbet og gør muskler og sener mere smidige.`],
['tiles',`Formålet med opvarmning`,[[`Formål`,`Mental parathed`],[`Formål`,`Fysisk parathed`],[`Formål`,`Skadesforebyggelse`],[`Formål`,`Bedre præstation`]]],
['h2',`Øvelser på video`],
['video',`Sådan styrker du din skulder. Forebyg skulderskader ved at styrke din udadrotation. Særligt for atleter, der træner med armene over hovedet, fx i håndbold og badminton.`],

['video',`Sådan laver du nordic hamstring. Forebygger skader i baglåret ved sprint og spark, fx i håndbold, fodbold og gymnastik.`]]},
'Akutte skader':{title:`Akutte skader`,lead:`Her får du gode råd til, hvad du kan gøre, hvis du får en akut skade.`,blocks:[
['p',`En akut skade opstår typisk ved en kraftig eller eksplosiv bevægelse eller et hurtigt retningsskift, hvor ledbånd, sener, muskler eller knogler bliver belastet mere, end de kan klare.`],
['p',`Følger du PEACE & LOVE, kan du forkorte skadesperioden. Det er en god idé at få råd hos en fysioterapeut.`],
['key',`Kontakt en læge`,`Er du i tvivl, om der er brud på en knogle, eller om et ledbånd er revet over, skal du altid kontakte en læge.`],

'Overbelastningsskader':{title:`Overbelastning`,lead:`Du forebygger overbelastningsskader ved at være i form til den belastning, du udsætter kroppen for. Opstår der en overbelastning, så lyt til kroppen og vend tilbage trin for trin.`,blocks:[

['h2',`Undgå overbelastning`],
['p',`Vænn dig gradvist til en høj træningsbelastning, og øg ikke mængden for hurtigt. Risikoen stiger, hvis du pludselig ændrer mængde, intensitet eller type af træning, især efter en genoptræning. En træningsdagbog er et godt værktøj.`],

['h2',`Tilbage til sporten`],

['h2',`Vaccination`],
['faq',[[`Influenza`,`Influenza er sjældent farligt for unge raske, og Team Danmark anbefaler ikke rutinemæssig vaccination. Men i perioder med hård træning kan det være relevant, især hvis du let bliver syg. Symptomerne er pludselig feber over 38 grader, muskelsmerter, kulderystelser, hovedpine og ondt i halsen. Bivirkningerne ved vaccinen er som regel milde, så læg den på en dag før en træningsfri dag. Du kan bl.a. blive vaccineret på mange apoteker.`],[`Covid-19`,`Vaccination forebygger de fleste tilfælde, og symptomerne er som regel mildere, hvis du alligevel bliver smittet. Følg stadig de almindelige råd, og lad dig teste, hvis du har symptomer.`]]],
['h2',`Generelle råd`],
['ul',[`Bliv hjemme, hvis du er syg eller har tegn på sygdom.`,`Vask hænder tit, eller brug håndsprit.`,`Gør rent, især på overflader, som mange rører ved.`,`Luft ud, og skab gennemtræk.`,`Host eller nys i ærmet.`]],
['h2',`Behandling af virusinfektion`],
['p',`De fleste infektioner i sæsonen skyldes virus, og der er ofte ingen specifik behandling. Næsespray som Stop Forkølelse eller 1-2 gram C-vitamin om dagen kan muligvis forkorte en forkølelse med et par dage, hvis du starter de første dage.`],

['faq',[[`§ 1-2 Navn og hjemsted`,`Team Danmark er oprettet efter Lov om Eliteidræt og er en offentlig selvejende institution omfattet af forvaltningsloven og offentlighedsloven. Hjemstedet er Brøndby Kommune.`],[`§ 3 Formål`,`Team Danmark skal udvikle dansk eliteidræt på en social og samfundsmæssig forsvarlig måde og sammen med DIF, specialforbundene og andre samarbejdspartnere sætte fælles indsatser i gang, koordinere og effektivisere dem.`],[`§ 4-5 Kapital og hæftelse`,`Midlerne kommer fra udlodningsloven, tilskud fra offentlige parter, et tilskud fra DIF og salg af sponsorater, tv-rettigheder og andre rettigheder. Team Danmark hæfter alene med sin formue.`],[`§ 6 Bestyrelse`,`Otte medlemmer beskikket af kulturministeren for fire år ad gangen, fire udpeget af ministeren og fire af DIF, heraf ét med særlig indsigt i atleters forhold. Mindst to skal være nuværende eller tidligere eliteudøvere eller -trænere.`],[`§ 7 Bestyrelsens opgaver`,`Bestyrelsen står for den overordnede ledelse. Beslutninger træffes ved simpelt flertal, og formandens stemme afgør ved stemmelighed. Bestyrelsen er beslutningsdygtig med mindst fem medlemmer.`],[`§ 8 Tegningsret`,`Team Danmark tegnes af to bestyrelsesmedlemmer, hvoraf den ene er formand eller næstformand, eller af direktionen sammen med to bestyrelsesmedlemmer.`],[`§ 9 Den daglige ledelse`,`Bestyrelsen ansætter en direktør, der står for den daglige ledelse under bestyrelsens tilsyn.`],[`§ 10 Indberetningsfunktion`,`Team Danmark har en lovpligtig selvstændig funktion, der behandler indberetninger. Den kan delegeres til en anden myndighed eller en privat aktør.`],[`§ 11 Budget, regnskab og revision`,`Regnskabsåret følger kalenderåret, og Kulturministeriet godkender budget, regnskab og ledelsesberetning.`],[`§ 12-13 Ændringer og opløsning`,`Vedtægterne kan ændres af kulturministeren. Team Danmark kan kun opløses ved en ændring af Lov om Eliteidræt.`]]],
['btn',`Læs Lov om eliteidræt`,``,]],people:LOTTE}
});

['p',`Du kan som Team Danmark-indplaceret atlet eller træner indberette uacceptabel adfærd, som kan være i strid med konkurrenceidrættens etiske kodeks. Din henvendelse vil blive behandlet af Anti Doping Danmark for at sikre uafhængighed af Team Danmark og forbund.`],

'Antidoping':{title:`Antidoping`,lead:`Doping hører ikke hjemme blandt atleter og passer ikke med idrættens etik og idealet om en fair og ligeværdig konkurrence.`,people:[],blocks:[
['p',`Team Danmark samarbejder med Danmarks Idrætsforbund om at bekæmpe dopingmisbrug i dansk idræt. Brug af doping er ikke foreneligt med idrættens etik og idealet om en fair og ligeværdig konkurrence.`],
['p',`I Danmark er dopingbekæmpelsen organiseret i Anti Doping Danmark, som er et uafhængigt agentur mellem Kulturministeriet og idrættens organisationer, som skal koordinere og styrke indsatsen mod doping.`],

'Sport og spillekultur':{title:`Sport og spillekultur`,lead:`Pengespil er underholdning for de fleste, men kan udvikle sig til afhængighed. Klare rammer for spillekulturen sikrer et sundt og fokuseret elitesportsmiljø.`,people:[],blocks:[
['p',`For en eliteatlet kan spil forstyrre sporten, uden at der er tale om ludomani. Derfor har Team Danmark sammen med DIF, Anti Doping Danmark og en række specialforbund lavet en fælles spillepolitik.`],
['tiles',`Fakta`,[[`Voksne danskere`,`Ca. 125.000 har problemer med pengespil`],[`Eliteudøvere`,`En risikogruppe, der spiller mere end gennemsnittet`],[`Køn`,`Næsten tre gange flere drenge end piger har problemer`]]],
['h2',`Balanceret spiladfærd`],
['p',`Spillet må ikke tage fokus og energi fra din sportslige udvikling eller give sociale eller økonomiske problemer for dig som atlet, træner eller leder.`],
['h2',`Hvorfor er atleter i risiko?`],
['ul',[`Eliteudøvere er mere konkurrenceorienterede end andre.`,`De har ofte stor viden om og interesse for sport.`,`De har ofte en opdelt hverdag med tid til spil.`]],
['h2',`Støtte og behandling`],
['p',`Er du i tvivl, om du er ved at udvikle en usund spiladfærd, eller er du bekymret for en ven, dit barn eller en atlet, så find vejledning hos Center for Ludomani.`],
['h2',`Matchfixing`],
['key',`Du har pligt til at reagere`,`Kender du til eller har du mistanke om matchfixing, spil på egne kampe eller misbrug af intern viden, skal du reagere og indberette det.`]]},
'Aktører':{title:`Aktører`,lead:`Team Danmark arbejder med ansvarlig eliteudvikling sammen med atleter, trænere, forbund og Elitekommuner.`,blocks:[['h2',`Atleter`],
['ul',[`Har mod til at tage ansvar for centrale elementer i egen karriere`,`Oplever meningsfuldhed, fx ved at være rollemodel og give tilbage til miljøet`,`Har blik for, hvad de ønsker deres karriere skal handle om udover resultater`,`Arbejder med sin mentale styrke og personlige udvikling og evner at være i nuet i accept af det uundgåelige ubehag`,`Behandler sig selv, kolleger og modstandere med omsorg og respekt`,`Evner at bede om hjælp`]],
['h2',`Trænere`],
['ul',[`Har en klar trænerfilosofi og formår at omsætte den i adfærd`,`Sætter mennesket før medaljetageren`,`Understøtter atleternes autonomi og involvering`,`Udviser interesse for og har strategi for at understøtte atleternes præstation, udvikling og trivsel`,`Tager ansvar for at skabe et miljø med høj tryghed`,`Har høj faglighed, er nysgerrig og søger sparring og viden`]],
['h2',`Forbund`],
['ul',[`Elitearbejdet i forbundet er forankret i en professionel driftsorganisation, der skal understøtte atleternes mulighed for at nå internationalt niveau`,`Der arbejdes ud fra en politisk vedtaget og forankret elitepolitik med klare strategier og målsætninger`,`Der er udarbejdet funktionsbeskrivelser med en klar ansvars- og kompetencefordeling`,`Der er en klar adskillelse imellem politik og driftsorganisationen`]],
['h2',`Elitekommuner`],
['ul',[`Elitekommunerne udvikler og understøtter i samspil med forbundene talentmiljøer, så unge talenter får mulighed for at begå sig på højeste internationale niveau`,`Giver talenter mulighed for at kombinere elitesport og uddannelse`,`Arbejder tæt sammen med idrætsskoler, ungdomsuddannelser og videregående uddannelsesinstitutioner`,`Understøtter lokalt talentarbejde baseret på Værdisæt for dansk talentudvikling`]]]},
'Etisk kodeks':{title:`Etisk kodeks`,lead:`Team Danmark og DIF har sammen lavet et etisk kodeks, der gælder for dansk konkurrenceidræt, herunder eliteidrætten.`,blocks:[
['h2',`Etisk kodeks`],
['p',`I henhold til Lov om Eliteidræt har Team Danmark og Danmarks Idrætsforbund i samarbejde udarbejdet et etisk kodeks for eliteidrætten. Kodekset forudsætter de nationale og internationale regler og love, som gælder for idrætten, og bygger på konkurrenceidrættens værdier for individ og samfund.`],
['p',`Etisk kodeks er senest revideret i 2022.`],

['dl',`Etisk kodeks for dansk konkurrenceidræt`,`Hele kodekset.`,`Læs kodekset`]]},
'Tilsynsprocedure':{title:`Tilsynsprocedure`,lead:`Team Danmark fører løbende tilsyn med, at forbundene agerer efter Lov om Eliteidræt og de gældende retningslinjer.`,blocks:[
['p',`Team Danmark skal sikre, at pengene bruges til det, de er givet til efter samarbejdsaftalerne med specialforbundene. Vi fører også tilsyn med, at elitearbejdet sker efter Team Danmarks etiske og sociale grundlag i Etisk kodeks for dansk konkurrenceidræt. Bliver retningslinjerne ikke overholdt, skal vi gå i dialog med atleter, trænere og forbund.`],
['p',`Udgangspunktet er et åbent, tillidsfuldt og gennemsigtigt samarbejde om ansvarlig eliteidræt og høj trivsel.`],
['h2',`Sådan fører vi tilsyn`],
['faq',[[`Masterplaner og samarbejdsaftaler`,`Masterplanen er forbundets ansøgning til Team Danmark med strategier og årlige mål. En godkendt masterplan og en juridisk samarbejdsaftale er en betingelse for støtten.`],[`Styregruppe- og arbejdsgruppemøder`,`Arbejdsgruppen følger løbende op på atleternes situation sportsligt, karrieremæssigt og personligt. Styregruppen mødes årligt og har det overordnede ansvar.`],[`Ad hoc-møder`,`Sportschefer, landstrænere og Team Danmarks medarbejdere mødes løbende om aktuelle problemstillinger.`],[`Tilstedeværelse i miljøerne`,`Medarbejderne er ofte til stede i elitemiljøerne, på træningslejre og ved konkurrencer og skal gå til ledelsen, hvis de oplever uregelmæssigheder.`],[`Årlige undersøgelser`,`IDAN laver hvert år en anonym trivselsundersøgelse og en anonym brugerundersøgelse blandt de indplacerede atleter.`]]],
['h2',`Sådan behandler vi sager`],
['p',`De fleste sager bliver løst i dialog mellem sportschef og Team Danmarks sportsmanager, og ledelserne bliver inddraget efter behov.`],
['key',`Anonymitet`,`Atleter og trænere, der henvender sig uden for det formelle tilsyn, kan være anonyme.`]]},
'Lov om eliteidræt':{title:`Lov om Eliteidræt`,lead:`Loven om Team Danmark og dansk eliteidræt trådte i kraft 1. juni 2004.`,blocks:[
['h2',`§ 1 Formål`],
['p',`Team Danmark er en offentlig selvejende institution, der skal udvikle dansk eliteidræt på en socialt og samfundsmæssigt forsvarlig måde. Sammen med DIF, specialforbundene og andre skal Team Danmark:`],
['ol',FORMAAL],

['h2',`De øvrige paragraffer`],
['faq',[[`§ 2 Bestyrelsen`,`Otte medlemmer beskikket af kulturministeren for fire år, fire udpeget af ministeren og fire af DIF. Kulturministeren udpeger formanden.`],[`§ 3 Midlerne`,`Bestyrelsen fordeler midlerne, udarbejder budget og aflægger regnskab og beretning.`],[`§ 4 Vedtægter`,`Kulturministeren godkender vedtægterne.`],[`§ 5 Klage`,`Afgørelser om støtte kan ikke indbringes for en anden administrativ myndighed.`],[`§ 6 Finansiering`,`Den primære finansiering er Team Danmarks andel af overskuddet fra Danske Spil, suppleret af DIF og salg af ydelser, rettigheder og sponsorater.`],[`§ 7 Kommuner`,`Kommuner kan støtte eliteidræt økonomisk, medmindre der er tale om egentlig erhvervsvirksomhed.`],[`§ 8-9 Ikrafttræden`,`Loven trådte i kraft 1. juni 2004 og gælder ikke for Færøerne og Grønland.`]]]],P:[0]}

['p',`Team Danmark giver hvert år op til 1,9 mio. kroner til forskningsprojekter, der kan skabe og implementere ny viden, som markant forbedrer danske eliteatleters konkurrenceevne. Et bedømmelsespanel med fageksperter vurderer ansøgningerne to gange om året.`],

['faq',[[`1. Fælles ejerskab og forankring i praksis`,`Projektet skal udvikles i tæt dialog mellem forskningsmiljø, specialforbund og Team Danmarks fageksperter med én tydelig projektejer fra hver organisation. Start dialogen i god tid, gerne seks måneder før fristen. Uden dokumenteret fælles ejerskab kommer ansøgningen som udgangspunkt ikke i betragtning.`],[`2. Aftalte roller og ansvar`,`Projektgruppen skal have en fælles forståelse af, hvem der har hvilke roller og ansvar.`],[`3. Dokumenteret effekt`,`Projektet skal have en klar plan for implementering og beskrive den forventede effekt på konkurrenceevnen, gerne frem mod fx OL eller VM.`],[`4. Prioriterede forbund og atleter`,`Projekter, der giver viden direkte til forbund og atleter støttet af Team Danmark, prioriteres. Det er en styrke, hvis viden kan bruges på tværs.`],[`5. Beskrevet risikoprofil`,`Både innovative højrisikoprojekter og sikrere projekter kan få støtte. Risici, vidensbidrag og forventet effekt skal være tydeligt beskrevet.`]]],

  if(e===1&&i===`Mental træning & trivsel`&&!o){page.innerHTML=pageMental();return;}

  if(e===1&&i===`Teknologi & performance`&&!o){page.innerHTML=pageL2(TP);return;}
  if(e===2&&i===`Til forældre`&&!o){page.innerHTML=pageL2(FO);return;}
  if(e===2&&i===`Til trænere & talentmiljøer`&&!o){page.innerHTML=pageL2(TR);return;}
  if(e===2&&i===`Til kommuner & forbund`&&!o){page.innerHTML=pageL2(KM);return;}
  if(e===3&&i===`Hvem vi er`&&!o){page.innerHTML=pageL2(HV);return;}
  if(e===3&&i===`Ansvarlig eliteidræt`&&!o){page.innerHTML=pageL2(AE);return;}
  if(e===3&&i===`Forskning og udvikling`&&!o){page.innerHTML=pageL2(FU);return;}
  if(e===3&&i===`Medarbejdere`&&!o){page.innerHTML=pageStaff();return;}
  if(e===3&&i===`Nyheder og presse`&&!o){page.innerHTML=pageL2(NP);return;}
  if(e===3&&i===`Partnere og samarbejde`&&!o){page.innerHTML=pageL2(PS);return;}
  if(e===0&&i===`Uddannelse og sportsgodkendelse`&&!o){page.innerHTML=pageL2(UD);return;}
  if(e===0&&i===`Din støtte fra Team Danmark`&&!o){page.innerHTML=pageL2(DS);return;}
  if(e===0&&i===`Som ung atlet`&&!o){page.innerHTML=pageL2(SU);return;}
  if(e===0&&i===`Mentorprogram for atleter`&&!o){page.innerHTML=pageL2(MP);return;}
  if(e===0&&i===`Karriere og livet efter sporten`&&!o){page.innerHTML=pageL2(KL);return;}
  if(e===0&&i===`Få hjælp og rådgivning`&&!o){page.innerHTML=pageL2(FH);return;}
  if(e===0&&i===`Atlethistorier`){ahPending=o||null;page.innerHTML=pageAH();return;}
  if(e===null){page.innerHTML=pageHome();return;}
  if(e===3&&i===null){page.innerHTML=pageOmos();return;}
  if(e===2&&i===null){page.innerHTML=pageTalent();return;}
  if(e===1&&i===null){page.innerHTML=pageTraening();return;}
  if(e===0&&i===null){page.innerHTML=pageAtleten();return;}
  let h='';
  if(e===null){
    h+=`<section class="content-band home-band"><div class="content-grid"><div class="content-heading"><p class="eyebrow">Team Danmark</p><h1>Atleten i centrum</h1><p>Vi kæmper for de danske atleter, så de kan kæmpe for Danmark.</p></div><div class="wire-media" aria-label="Plads til atletbillede"><span>Atletbillede eller video</span></div></div></section><section class="task-band"><div class="section-label"><p class="eyebrow">Find din vej</p><h2>Hvad leder du efter?</h2></div><div class="task-list">${x.map((s,n)=>`<button class="task-row" data-act="section" data-a="${n}"><span class="task-number">${pad(n+1)}</span><span>${esc(s.title)}</span>${arrow(20)}</button>`).join('')}</div></section>`;
  }else{
    const sec=x[e];
    let crumbs=`<button type="button" data-act="home">Forside</button><span aria-hidden="true">/</span>`;
    if(i){
      crumbs+=`<button type="button" data-act="section" data-a="${e}">${esc(sec.title)}</button><span aria-hidden="true">/</span>`;
      crumbs+=o?`<button type="button" data-act="crumb-sub">${esc(i)}</button><span aria-hidden="true">/</span><span aria-current="page">${esc(o)}</span>`:`<span aria-current="page">${esc(i)}</span>`;
    }else{
      crumbs+=`<span aria-current="page">${esc(sec.title)}</span>`;
    }
    h+=`<section class="content-band"><nav class="breadcrumbs" aria-label="Brødkrummer">${crumbs}</nav><div class="content-grid"><div class="content-heading"><p class="eyebrow">${esc(sec.title)}</p><h1>${esc(o??i??sec.title)}</h1><p>${esc(introText(sec))}</p></div><div class="wire-media" aria-label="Plads til relevant indholdsbillede"><span>Indholdsbillede</span></div></div></section>`;
    h+=bodyBlock(sec);
  }
  if(e===0&&i===null){
    h+=`<section class="stories-band"><div class="stories-heading"><div><p class="eyebrow">Atletliv</p><h2>Erfaringer fra hele rejsen</h2></div><button class="stories-all"><span>Se alle historier om atletlivet</span>${arrow(18)}</button></div><div class="stories-grid">${C.map(s=>`<button class="story-card"><span class="story-image">Atletportræt</span><span class="story-copy"><span class="eyebrow">${esc(s.category)}</span><strong>${esc(s.title)}</strong>${arrow(19)}</span></button>`).join('')}</div></section>`;
    h+=`<section class="quick-band"><div><p class="eyebrow">Praktisk for atleter</p><h2>Genvej</h2></div><div class="quick-grid"><button><span>Skat og sport</span>${arrow(18)}</button><button><span>Konkurrencer og resultater</span>${arrow(18)}</button></div></section>`;
  }
  h+=`<section class="quick-band" id="aktuelt"><div><p class="eyebrow">Populære genveje</p><h2>Direkte til handling</h2></div><div class="quick-grid">${S.map(t=>`<button><span>${esc(t)}</span>${arrow(18)}</button>`).join('')}</div></section>`;
  h+=`<section class="newsletter-band" aria-labelledby="newsletter-title"><div><p class="eyebrow">Nyt fra Team Danmark</p><h2 id="newsletter-title">Tilmeld dig vores nyhedsmail</h2></div><form class="newsletter-form" id="newsletter-form"><label for="newsletter-email">E-mail</label><div><input id="newsletter-email" type="email" placeholder="Skriv din e-mail"><button type="submit"><span>Tilmeld</span>${arrow(18)}</button></div><label class="privacy-check"><input type="checkbox" id="newsletter-privacy"><span>Jeg accepterer privatlivspolitikken</span></label></form></section>`;
  h+=`<footer id="kontakt"><div class="brand footer-brand"><span class="brand-mark inverse">TD</span><span>TEAM DANMARK</span></div><p>Vi kæmper for de danske atleter, så de kan kæmpe for Danmark.</p><div class="footer-links"><a href="#kontakt" data-act="l3go" data-a="0" data-t="Kontakt Team Danmark">Kontakt</a><a href="#aktuelt" data-act="fnav" data-a="3" data-i="Nyheder og presse" data-t="">Nyheder og presse</a><a href="#kontakt" data-act="fnav" data-a="3" data-i="Nyheder og presse" data-t="Job og praktik">Job</a><a href="#aktuelt" data-act="fnav" data-a="3" data-i="Ansvarlig eliteidræt" data-t="">Ansvarlig eliteidræt</a><a href="#aktuelt" data-act="fnav" data-a="0" data-i="Få hjælp og rådgivning" data-t="">Hjælp &amp; svar</a><a href="#aktuelt" data-act="fnav" data-a="0" data-i="Som ung atlet" data-t="Talentklasser">Materialer til skoleelever</a><a href="https://www.teamdanmark.dk/presse/privatlivspolitik" target="_blank" rel="noopener">Privatliv</a></div></footer>`;
  page.innerHTML=h;
}

function renderAll(){ updateHeader(); renderScrollNav(); renderPage(); renderScrollNav(); applyHidden(); }

/* ---------- navigation ---------- */
function blur(){ if(document.activeElement instanceof HTMLElement)document.activeElement.blur(); }
function toTop(){ window.setTimeout(()=>window.scrollTo({top:0,behavior:'auto'}),0); }
function go(e,i,o){
  blur();
  const wasHome=st.e===null;
  st.e=e;st.i=i;st.o=o;st.n=null;st.c=false;
  if(e===null)st.d=false; else if(wasHome||true)lastY=window.scrollY;
  renderAll();
  toTop();
}
function goHome(){ st.e=null;st.i=null;st.o=null;st.n=null;st.c=false;st.d=false; renderAll(); }
function goPage(t){
  if(st.i&&ARTX[st.i]&&ARTX[st.i][t]){go(st.e??1,st.i,t);return;}
  const ok=KROP.includes(t)||has(O,t)||has(A,t)||has(M,t);
  if(!ok)return;
  const keep=[`Kost & ernæring`,`Mental træning & trivsel`,`Skader & behandling`];
  go(1,keep.includes(st.i)?st.i:`Krop & fysisk træning`,t);
}

app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const act=b.dataset.act, a=b.dataset.a!==undefined?Number(b.dataset.a):null, t=b.dataset.t;
  if(act==='home')goHome();
  else if(act==='section')go(a,null,null);
  else if(act==='sub'){if(t==='Medarbejdere')staffPending=st.i;go(a,t,null);}
  else if(act==='page')goPage(t);
  else if(act==='l3')go(st.e,st.i,t);
  else if(act==='crumb-sub'){st.o=null;renderAll();}
  else if(act==='mobile'){st.c=!st.c;updateHeader();}
  else if(act==='ta-prev'||act==='ta-next'){const sc=b.closest('section');const tr=(sc&&sc.querySelector('.ta-track'))||document.getElementById('ta-track');if(tr){const c=tr.firstElementChild;tr.scrollBy({left:(act==='ta-next'?1:-1)*(c?c.offsetWidth+24:600)});}}
  else if(act==='fp-prev'||act==='fp-next'){const tr=document.getElementById('fp-track');if(tr){const c=tr.firstElementChild;tr.scrollBy({left:(act==='fp-next'?1:-1)*(c?c.offsetWidth+40:400)});}}
  else if(act==='expert')setExpert(a);
  else if(act==='annot'||act==='annot-close'){const host=b.closest('.annot');const card=host.querySelector('.annot-card'),dot=host.querySelector('.annot-dot');const open=act==='annot'?card.hidden:false;card.hidden=!open;dot.setAttribute('aria-expanded',String(open));if(!open)dot.focus();}
  else if(act==='pacc')openPacc(a);
  else if(act==='staff-f'){staffF=t;staffRefresh();renderScrollNav();}
  else if(act==='ah-f'){ahF=t;ahRefresh();renderScrollNav();}
  else if(act==='fnav2')go(2,`Til forældre`,t);
  else if(act==='ekmap')ekPick(t);
  else if(act==='ekclose')ekPick(null);
  else if(act==='search')srchOpen();
  else if(act==='srch-close')srchClose();
  else if(act==='srch-go'){const r=srchIndex()[a];srchClose(false);if(r)r.go();}
  else if(act==='srch-pop'){const p=SRCH_POP[a];srchClose(false);go(p[1],p[2],p[3]);}
  else if(act==='srch-page')srchGoPage(srchQ);
  else if(act==='fa-p'){faP=a;faRefresh(true);}
  else if(act==='fa-m'){faM=!faM;faP=0;faRefresh();}
  else if(act==='fa-fb'){faS=a;faP=0;faQ='';const q=document.getElementById('fa-q');if(q)q.value='';faRefresh(true);}
  else if(act==='kk-f'){kkF=t;kkRefresh();}
  else if(act==='kk-m'){kkOpen.has(a)?kkOpen.delete(a):kkOpen.add(a);const el=document.getElementById('kk-m'+a);if(el){el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));}}
  else if(act==='ud-f'){udF=t;udP=0;udRefresh();}
  else if(act==='ud-p'){udP=a;udRefresh(true);}
  else if(act==='np-f'){npF=t;npP=0;npRefresh();}
  else if(act==='np-p'){npP=a;npRefresh(true);}
  else if(act==='srch-f'){srchF=t;page.innerHTML=pageSearch();}
  else if(act==='fp-menu')fpMenu();
  else if(act==='fp-set')fpSet(a);
  else if(act==='fp-pause'){fpPaused=!fpPaused;fpSet(fpV);}
  else if(act==='ahg'){if(st.i===`Atlethistorier`){ahF=t;ahRefresh();renderScrollNav();}else go(0,`Atlethistorier`,t);}
  else if(act==='stg'){if(st.i===`Medarbejdere`&&!st.o){staffF=t;staffRefresh();renderScrollNav();}else{staffPending=t;go(3,`Medarbejdere`,null);}}
  else if(act==='rv-f'){rvF=t;rvP=0;rvRefresh();}
  else if(act==='rv-p'){rvP=+a;rvRefresh(true);}
  else if(act==='l3go'){ev.preventDefault();go(a,`Få hjælp og rådgivning`,t);}
  else if(act==='fnav'){ev.preventDefault();go(a,b.dataset.i,t||null);}
  else if(act==='ar-jump'){const el=document.getElementById(t);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-110,behavior:'smooth'});}
  else if(act==='staff-open')staffOpen(a);
  else if(act==='staff-close')staffClose();
  else if(act==='acc')toggleAcc(a);else if(act==='faq'){const items=[...document.querySelectorAll('.ta-faq-item')];items.forEach((it,i)=>{const b=it.firstElementChild,pn=it.children[1];const open=i===a&&b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));pn.hidden=!open;});}
  else if(act==='mgroup'){st.n=st.n===a?null:a;updateOverlays();}
});
function openPacc(k){const box=document.getElementById('ta-pacc');if(!box)return;[...box.children].forEach((it,i)=>{it.firstElementChild.setAttribute('aria-expanded',String(i===k));it.children[1].hidden=i!==k;});}
app.addEventListener('mouseover',ev=>{if(!window.matchMedia('(hover:hover)').matches)return;const it=ev.target.closest('#ta-pacc>.ta-acc-item');if(!it)return;const k=[...it.parentNode.children].indexOf(it);if(it.firstElementChild.getAttribute('aria-expanded')!=='true')openPacc(k);});
app.addEventListener('input',ev=>{if(ev.target&&ev.target.id==='fa-q'){faQ=ev.target.value;faP=0;faRefresh();return;}if(ev.target&&ev.target.id==='kk-q'){kkQ=ev.target.value;kkRefresh();return;}if(ev.target&&ev.target.id==='srch-q'){srchQ=ev.target.value;srchSel=-1;srchUpd();return;}if(ev.target&&ev.target.id==='st-q'){staffQ=ev.target.value;staffRefresh();}});
app.addEventListener('submit',ev=>ev.preventDefault());
document.addEventListener('submit',ev=>{if(ev.target&&ev.target.hasAttribute('data-nl')){ev.preventDefault();const f=ev.target,i=f.querySelector('input'),m=f.querySelector('.nl-msg');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value)){m.textContent='Skriv en gyldig e-mailadresse.';m.className='nl-msg is-err';i.setAttribute('aria-invalid','true');i.focus();return;}i.removeAttribute('aria-invalid');f.classList.add('is-done');m.className='nl-msg is-ok';m.textContent='Tak. Du er nu tilmeldt nyhedsmailen.';return;}if(ev.target&&ev.target.hasAttribute('data-srch-form')){ev.preventDefault();srchQ=document.getElementById('srch-pq').value;srchF='Alle';page.innerHTML=pageSearch();const i=document.getElementById('srch-pq');if(i)i.focus();}});
document.addEventListener('change',ev=>{const t=ev.target;if(!t)return;if(t.id==='fa-s'){faS=+t.value;faP=0;faRefresh();}else if(t.id==='fa-o'){faSort=t.value;faP=0;faRefresh();}});
document.addEventListener('click',ev=>{const m=document.getElementById('fp-menu');if(m&&!m.hidden&&!ev.target.closest('.fp-pick'))fpMenu(false);});
document.addEventListener('keydown',ev=>{if(ev.target&&ev.target.id==='srch-q'){const opts=[...document.querySelectorAll('#srch-list [role=option] button')];if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();if(!opts.length)return;srchSel=ev.key==='ArrowDown'?(srchSel+1)%opts.length:(srchSel<=0?opts.length-1:srchSel-1);srchUpd();return;}if(ev.key==='Enter'){ev.preventDefault();const o=document.querySelectorAll('#srch-list [role=option] button')[srchSel];if(srchSel>=0&&o)o.click();else if(srchNorm(srchQ).length>=2)srchGoPage(srchQ);return;}}
  if(ev.key==='Escape'&&!document.getElementById('srch').hidden){srchClose();return;}
  if(ev.key==='Tab'&&!document.getElementById('srch').hidden){const p=document.querySelector('.srch-panel');const fs=[...p.querySelectorAll('input,button:not([tabindex="-1"])')];if(fs.length){const fi=fs[0],la=fs[fs.length-1];if(ev.shiftKey&&document.activeElement===fi){ev.preventDefault();la.focus();}else if(!ev.shiftKey&&document.activeElement===la){ev.preventDefault();fi.focus();}}}
  if(ev.key!=='Escape')return;{const m=document.getElementById('fp-menu');if(m&&!m.hidden){fpMenu(false);document.getElementById('fp-v').focus();return;}}staffClose();if(ekSel)ekPick(null);document.querySelectorAll('.annot-card:not([hidden])').forEach(c=>{c.hidden=true;const d=c.parentElement.querySelector('.annot-dot');d.setAttribute('aria-expanded','false');d.focus();});});
app.addEventListener('mouseover',ev=>{const b=ev.target.closest('[data-act="expert"]');if(b&&!b.classList.contains('is-active'))setExpert(Number(b.dataset.a));const ac=ev.target.closest('[data-act="acc"]');if(ac)toggleAcc(Number(ac.dataset.a));});
navButtons.forEach((b,i)=>{
  b.addEventListener('mouseenter',()=>setMega(i));
  b.addEventListener('focus',()=>setMega(i));
});
hdr.addEventListener('mouseleave',()=>setMega(null));

let ticking=false;
document.addEventListener('scroll',ev=>{const t=ev.target;if(!t||!t.classList||!(t.id==='fp-track'||t.classList.contains('ta-track')))return;const k=t.id==='fp-track'?'fp':'ta';const sc=(k==='ta'&&t.closest('section'))||document;const pv=sc.querySelector(`[data-act="${k}-prev"]`),nx=sc.querySelector(`[data-act="${k}-next"]`);if(pv)pv.classList.toggle('is-muted',t.scrollLeft<4);if(nx)nx.classList.toggle('is-muted',t.scrollLeft+t.clientWidth>=t.scrollWidth-4);},true);
window.addEventListener('scroll',()=>{
  if(ticking)return;
  ticking=true;
  window.requestAnimationFrame(()=>{
    ticking=false;
    if(st.e===null){ if(st.d){st.d=false;applyHidden();} lastY=window.scrollY; return; }
    const y=window.scrollY, diff=y-lastY;
    let d=st.d;
    if(y<120)d=false; else if(Math.abs(diff)>8)d=diff>0;
    lastY=y;
    if(d!==st.d){st.d=d;applyHidden();}
  });
},{passive:true});

renderAll();
</script>
