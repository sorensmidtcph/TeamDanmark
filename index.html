}

/* Til atleten: sektionsforside fra Figma (02 Sektionsside) */
.ta{--tg:clamp(16px,2.78vw,40px)}
.ta button{text-align:left}
.ta-wrap{padding-inline:var(--tg)}
.ta-crumbs{padding:24px var(--tg) 0;margin-bottom:0}
.ta-h1{font-size:clamp(40px,5vw,72px);font-weight:600;line-height:1.1;max-width:860px;margin:48px 0 24px;text-wrap:balance}
.ta-ph{background:var(--fill)}
.ta-hero{aspect-ratio:1360/664;border-radius:32px;max-width:100%}
.ta-h56{font-size:clamp(30px,3.9vw,56px);font-weight:600;line-height:1.3;max-width:1250px}
.ta-h48{font-size:clamp(28px,3.35vw,48px);font-weight:600;line-height:1.2}
.ta-body{font-size:20px;font-weight:500;line-height:1.4}
.ta-intro{margin-top:48px}
.ta-introrow{grid-template-columns:minmax(0,553px) minmax(0,473px);align-items:center;gap:40px;margin:64px 0 0 13.2%;display:grid}
.ta-img{aspect-ratio:1;border-radius:16px}
.ta-introrow .ta-body{margin-top:8px}
.st-tools{margin-top:48px}
.st-tools .st-filters{margin-top:0}
.st-search{display:block;max-width:560px}
.st-search input{box-sizing:border-box;max-width:100%;width:100%;height:56px;border:1px solid #d4d4d4;border-radius:60px;padding:0 24px;font-size:17px;background:#fff}
.st-filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.st-chip{border:1px solid #d4d4d4;border-radius:60px;padding:7px 16px;font-size:15px;font-weight:500;line-height:22px;background:#fff}
.st-chip.is-on{background:#22282b;border-color:#22282b;color:#fff}
.st-count{margin-top:24px;font-size:15px;font-weight:500;color:var(--body2)}
.st-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px 24px;margin:40px 0 0;padding:0;list-style:none}
.st-card{display:flex;flex-direction:column;min-width:0}
.st-card .st-ph{aspect-ratio:1;border-radius:20px;display:block;margin-bottom:16px}
.st-card strong{font-size:20px;font-weight:600;line-height:1.25;overflow-wrap:break-word}
.st-title{margin-top:4px;font-size:16px;font-weight:500;hyphens:auto;overflow-wrap:anywhere}
.st-extra{margin-top:2px;font-size:14px;font-weight:500;color:var(--body2)}
.st-contact{margin-top:12px;font-size:15px;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.st-contact a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.st-more{align-self:flex-start;margin-top:16px;padding:7px 16px;font-size:14px}
.st-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;opacity:0;transition:opacity .25s}
.st-overlay.is-open{opacity:1}
.st-drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#fff;z-index:201;overflow-y:auto;padding:72px 40px 48px;transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 32px rgba(0,0,0,.12)}
.st-drawer.is-open{transform:none}
.st-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border:1px solid #d4d4d4;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.st-dph{display:block;aspect-ratio:4/3;border-radius:20px;margin-bottom:24px}
.st-drawer h2{font-size:32px;font-weight:600;line-height:1.15}
.st-drawer .st-title{margin-top:8px;font-size:18px}
.st-drawer .st-extra{font-size:15px}
.st-bio{margin-top:20px;font-size:17px;font-weight:500;line-height:1.5}
.st-drawer .st-contact{margin-top:24px;font-size:16px}
@media (max-width:600px){.st-drawer{padding:72px 20px 40px}}
.st-group{margin-top:72px}
.st-group:first-child{margin-top:0}
#st-grid{margin-top:48px}
#st-grid>.st-grid{margin-top:0}
.st-gh{font-size:clamp(24px,2.3vw,32px);font-weight:600;line-height:1.2;padding-bottom:16px;border-bottom:1px solid #d4d4d4}
.st-group .st-grid{margin-top:32px}
.np-press{margin-top:48px!important}
.st-press{margin-top:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;border:1px solid #d4d4d4;border-radius:20px;padding:28px 32px}
.st-press h2{font-size:24px;font-weight:600;line-height:1.2}
.st-press p{margin-top:6px;font-size:17px;font-weight:500;line-height:1.45}
.st-press a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.st-press .ta-ghost{flex:none}

const M={Sportsmedicin:{intro:`Forebyggelse og behandling af skader, infektioner og sygdom omkring træning og konkurrence.`,lead:`Sportsmedicin hjælper atleten med at forebygge problemer, reagere tidligt og vende sikkert tilbage til sporten.`,sections:[{title:`Forebyg skader`,text:`Opvarmning, varieret træning og gradvis belastning nedsætter risikoen for både akutte skader og overbelastning.`,points:[`Skadesforebyggende øvelser`,`Belastningsstyring`,`Kend kroppens signaler`]},{title:`Behandl og vend tilbage`,text:`Den rette tidlige indsats og en trinvis genoptræning hjælper vævet tilbage til sportens krav.`,points:[`PEACE & LOVE`,`Trappemodellen`,`Faglig vurdering`]},{title:`Sundhed omkring sporten`,text:`Infektioner, rejser og hjernerystelse kræver planlægning og tydelige kriterier for tilbagevenden.`,points:[`Forebyg infektion`,`Forbered rejsen`,`Vend gradvist tilbage`]}],metrics:[[`Forebyg`,`Før problemet`,`Opvarmning og gradvis belastning`],[`Reagér`,`Ved symptomer`,`Tidlig vurdering og behandling`]],related:[`Guidelines om hjernerystelse`,`Skadesforebyggende træning`]},"Skadesforebyggende træning":{intro:`Øvelser og træningsprincipper, der kan nedsætte risikoen for skader.`,lead:`Du kan aldrig sikre dig helt mod skader, men specifikke programmer og en grundig opvarmning kan reducere risikoen.`,sections:[{title:`Opvarmning`,text:`Opvarmningen skaber mental og fysisk parathed og forbedrer musklernes og senernes arbejdsbetingelser.`,points:[`Mental parathed`,`Fysisk parathed`,`Skadesforebyggelse`,`Bedre performance`]},{title:`Målrettede øvelser`,text:`Øvelser vælges efter sportens bevægelser og atletens risikoprofil.`,points:[`Skulderens udadrotation`,`Copenhagen Adduction`,`Nordic Hamstring`]}],metrics:[[`100 %`,`Kan ikke garanteres`,`Risikoen kan reduceres`],[`3`,`Øvelseseksempler`,`Skulder, lyske og baglår`]],related:[`Videoer med skadesforebyggende øvelser`]},"Akutte skader":{intro:`Gode råd til den første behandling og den trinvise vej tilbage efter en akut s const N={Periodisering:{intro:`Undgå stagnation og planlæg formtopning på de rigtige tidspunkter.`,lead:`Periodisering skaber struktureret variation i øvelser, belastning, pauser, intensitet og træningsmængde.`,sections:[{title:`Lineær periodisering`,text:`Træningsvolumen falder, mens intensiteten stiger over tid. Modellen egner sig især til sportsgrene med færre årlige konkurrencer.`,points:[`Høj volumen og lav intensitet i starten`,`Gradvis overgang mod høj intensitet`,`Formtopning ved udvalgte konkurrencer`]},{title:`Nonlineær periodisering`,text:`Volumen og intensitet varieres over kortere perioder for at fastholde et højt fysisk niveau gennem en lang sæson.`,points:[`4-6 RM`,`8-10 RM`,`12-15 RM`]},{title:`Opbygningsperioder`,text:`I sommer- eller vinterpauser kan en lineær periode bruges til at forbedre udvalgte fysiske parametre.`,points:[`4 uger`,`8 uger`,`12 uger`]}],metricTitle:`Lineær model`,metrics:[[`Muskelopbygning`,`Høj volumen`,`Lav-moderat intensitet`],[`Muskelstyrke`,`Høj volumen`,`Moderat intensitet`],[`Eksplosiv styrke`,`Moderat volumen`,`Høj intensitet`],[`Formtopning`,`Lav volumen`,`Meget høj intensitet`]],contacts:E,related:`Produktkatalog`},Restitution:{intro:`Planlægning, gentagelse og fokus sikrer fremgang i træningen og optimal præstationsevne.`,lead:`Team Danmarks restitutionskoncept bygger på dokumenteret effekt og den enkelte atlets virkelighed.`,sections:[{title:`Basen i restitutionskonceptet`,text:`Omkring 95 procent af fremgangen knytter sig til kvalitet og kontinuitet i træning, kost, søvn samt mental og social genopladning.`,points:[`Træning`,`Søvn`,`Kost`,`Mental og social genopladning`]},{title:`Derfor skal du restituere`,text:`Restitution gør kroppen klar til ny træning og hjælper med at genopbygge efter belastning.`,points:[`Restituer før træning og konkurrence`,`Restituer efter belastning`,`Planlæg næste indsats`]},{title:`Pyramidens top`,text:`Aktiv, ernæringsmæssig og passiv restitution udgør den mindre del og vælges efter ti  fp:[`Forsiden introducerer Team Danmark som én samlet fortælling frem for en oversigt over hele websitet.`,`Den starter med, hvorfor Team Danmark findes, hvad organisationen gør, og menneskesynet bag. Derefter går den gennem de tre universer: atleten, den sportsfaglige viden og udviklingen af fremtidens elite.`,`Hvert univers er vist med sektionens egen hovedlinje og ét modul derfra, så brugeren genkender det, når de klikker videre.`,`Herefter flytter fokus fra Team Danmarks arbejde til det, arbejdet handler om: konkurrencerne og historierne fra dansk eliteidræt.`,`Elitesupport afslutter som en konkret indgang til hjælp.`,`hvorfor vi findes → hvad vi gør → hvad vi tror på → atleten → træning & sundhed → talent & udvikling → når det gælder → historierne bag → hjælp`],
 ke:[`Forslag til en skabelon for undersider på niveau 2. Her er den vist med Kost & ernæring.`,`Siden starter med, hvorfor kost og væske betyder noget for præstationen, og hvad Team Danmarks eksperter hjælper med. Derefter kommer emnerne, så brugeren hurtigt kan gå videre til det, de leder efter.`,`Værktøjerne og rådene om måltider omkring træningen giver noget konkret at handle på. Energiberegneren er en af de mest besøgte sider på sitet.`,`Historierne viser kosten i praksis. Til sidst møder man eksperterne, får svar på de mest almindelige spørgsmål og kan finde vej til fortrolig hjælp gennem Elitesupport.`,`hvorfor det betyder noget → hvad vi hjælper med → emnerne → værktøjer → måltider omkring træningen → kost i hverdagen → eksperterne → spørgsmål og svar → hjælp`],


 kf:[`Samme skabelon for niveau 2 som Kost & ernæring, her med Krop & fysisk træning.`,`Siden starter med, hvorfor målrettet fysisk træning betyder noget for præstationen, og hvad Team Danmarks sportsfysiologer hjælper med. Derefter kommer emnerne, så brugeren hurtigt kan gå videre.`,`Værktøjerne og periodiseringen giver noget konkret at planlægge efter: hvordan styrketræningen tilpasses, og hvordan træningen bygges op mod en formtop.`,`Historierne viser træningen i praksis. Til sidst møder man sportsfysiologerne, får svar på de mest almindelige spørgsmål og kan finde vej til fortrolig hjælp gennem Elitesupport.`,`hvorfor det betyder noget → hvad vi hjælper med → emnerne → værktøjer → træningen over sæsonen → træning i hverdagen → eksperterne → spørgsmål og svar → hjælp`],

 mt:[`Samme skabelon for niveau 2 som Kost & ernæring og Krop & fysisk træning, her med Mental træning & trivsel.`,`Siden starter med, at den mentale side af sporten kan trænes ligesom den fysiske, og med hvad Team Danmarks sportspsykologiske konsulenter hjælper med. Derefter kommer emnerne.`,`Øvelserne giver noget konkret at træne med, og modellen for mental sundhed forklarer, hvornår man skal være opmærksom.`,`Historierne viser det mentale arbejde i praksis. Til sidst møder man konsulenterne, får svar på de mest almindelige spørgsmål og kan finde vej til fortrolig hjælp gennem Elitesupport.`,`hvorfor det betyder noget → hvad vi hjælper med → emnerne → øvelser → grøn, gul og rød → mental træning i hverdagen → konsulenterne → spørgsmål og svar → hjælp`],
 sb:[`Samme skabelon for niveau 2 som de andre fagområder, her med Skader & behandling.`,`Siden starter med, at der er meget, man selv kan gøre for at undgå skader og sygdom, og med hvad Team Danmarks fysioterapeuter og læge hjælper med. Derefter kommer emnerne.`,`Modellen for at komme tilbage efter en skade og værktøjerne til forebyggelse giver noget konkret at handle på.`,`Historierne viser vejen tilbage i praksis. Til sidst møder man eksperterne, får svar på de mest almindelige spørgsmål og kan finde vej til fortrolig hjælp gennem Elitesupport.`,`hvorfor det betyder noget → hvad vi hjælper med → emnerne → hold dig klar → tilbage trin for trin → skader i hverdagen → eksperterne → spørgsmål og svar → hjælp`],
 fo:[`Samme skabelon for niveau 2 som fagområderne, her med Til forældre under Talent & udvikling.`,`Siden starter med, at forældre er nogle af de vigtigste personer i barnets sportsliv, og med hvad forældreguiden kan hjælpe med. Derefter kommer de fire emner: forældreguiden, de gode råd, undervisningsmaterialet og talentklasser.`,`De ni gode råd giver noget konkret at handle på med det samme, og materialerne kan hentes direkte.`,`Historierne viser forældrerollen i praksis. Til sidst møder man eksperterne bag talentarbejdet, får svar på de mest almindelige spørgsmål og kan kontakte Team Danmark.`,`hvorfor det betyder noget → hvad guiden hjælper med → emnerne → guiden og materialerne → ni gode råd → forældre i hverdagen → eksperterne → spørgsmål og svar → kontakt`],
 tr:[`Samme skabelon for niveau 2 som fagområderne og Til forældre, her med Til trænere & talentmiljøer under Talent & udvikling.`,`Siden starter med, at atleten bliver formet af den daglige træning og af trænerne, og med hvad Team Danmark giver trænere og talentmiljøer. Derefter kommer de fem emner: ATK 2.0, TalentHUSET, Life Skills, talentklasser og kompetenceudvikling.`,`Materialerne kan hentes direkte, og TalentHUSETs fem værdier giver en fælles ramme for arbejdet med talenter.`,`Historierne viser talentmiljøer i praksis. Til sidst møder man eksperterne bag talentarbejdet, får svar på de mest almindelige spørgsmål og kan finde vej til fortrolig hjælp gennem Elitesupport.`,`hvorfor det betyder noget → hvad vi giver trænerne → emnerne → materialerne → fem værdier → talentmiljøer i hverdagen → eksperterne → spørgsmål og svar → hjælp`],
 km:[`Samme skabelon for niveau 2 som de andre sider under Talent & udvikling, her med Til kommuner & forbund.`,`Siden starter med, at dansk eliteidræt bygger på et tæt samarbejde mellem kommuner, forbund og den frivillige idræt, og med hvad samarbejdet med Team Danmark går ud på. Derefter kommer de fire emner: Elitekommuner, oversigten, kompetenceudvikling og støttekonceptet.`,`Koncepterne kan hentes direkte, og modulet om kravene forklarer, hvad det kræver at blive Elitekommune.`,`Historierne viser samarbejdet i praksis. Til sidst møder man eksperterne, får svar på de mest almindelige spørgsmål og kan kontakte Team Danmark om et samarbejde.`,`hvorfor det betyder noget → hvordan vi samarbejder → emnerne → koncepterne → sådan bliver man Elitekommune → samarbejdet i praksis → eksperterne → spørgsmål og svar → kontakt`],
 hv:[`Samme skabelon for niveau 2 som de andre undersider, her med Hvem vi er under Om os.`,`Siden starter med missionen i én sætning og forklarer derefter vision, mission og formål. Bagefter kommer emnerne: vision og mission, strategi samt organisation og bestyrelse.`,`Rammerne for arbejdet, fx loven, rammeaftalen, strategien og årsberetningen, kan læses direkte, og atletens rejse viser, hvordan Team Danmark følger atleten fra klubben til livet efter sporten.`,`Nyhederne viser, hvad organisationen arbejder med lige nu. Til sidst møder man ledelsen, får svar på de mest almindelige spørgsmål og kan kontakte Team Danmark.`,`hvem vi kæmper for → vision, mission og formål → emnerne → atletens rejse → rammerne → nyheder → ledelsen → spørgsmål og svar → kontakt`],
 ae:[`Samme skabelon som Hvem vi er, her med Ansvarlig eliteidræt under Om os.`,`Siden starter med Team Danmarks formuléring om en socialt og samfundsmæssigt forsvarlig udvikling af eliteidrætten, og med hvad Lov om eliteidræt forpligter Team Danmark til. Derefter kommer de syv emner fra det nuværende website: EliteSupport, antidoping, spillekultur, aktører, etisk kodeks, tilsyn og loven.`,`EliteSupport ligger lige efter introen, så man hurtigt kan sige fra. Karrusellen viser, at alle omkring atleten har et ansvar, også forældre og Team Danmark selv. Derefter forklarer accordion'en tilsynet kort.`,`Til sidst får man svar på de mest almindelige spørgsmål og kan kontakte de ansvarlige under Yderligere oplysninger.`,`forsvarlig eliteidræt → sådan tager vi ansvar → EliteSupport → emnerne → alle har et ansvar → tilsyn → spørgsmål og svar → yderligere oplysninger`],

 fu:[`Samme skabelon som Hvem vi er og Ansvarlig eliteidræt, her med Forskning og udvikling under Om os.`,`Siden starter med, hvorfor Team Danmark forsker, og hvordan forskningen bruges. Derefter kommer de fire emner: resultater og viden, forskningsstøtte, netværk og samarbejdspartnere og det nationale elitesportscenter.`,`Det nationale elitesportscenter med højdehotel og klimakammer viser forskningen helt konkret, og casene viser, hvad forskningen har fundet ud af.`,`Accordion'en viser, hvad der forskes i, med links til fagsiderne, og karrusellen viser de typer af støtte, forskere kan søge, efterfulgt af universiteterne og fondene, vi samarbejder med. Til sidst møder man eksperterne, får svar på de mest almindelige spørgsmål og kan melde en idé ind.`,`hvorfor vi forsker → sådan bruger vi forskning → emnerne → højdehotellet → forskning i praksis → det forsker vi i → typer af støtte → samarbejdspartnere → mød eksperterne → spørgsmål og svar → idéer`],

 me:[`Medarbejdersiden er en oversigt over alle 64 medarbejdere, hentet fra det nuværende website.`,`Siden starter med samme hero og statement som de andre sider, og journalister får pressekontakten med det samme. Filteret bruger de samme navne som fagområderne, og under ”Alle” er medarbejderne grupperet med den faglige leder først. Kommer man fra ”Se medarbejder” på en fagside, er filteret allerede valgt.`,`Hvert kort har en grå boks til portræt, navn, titel, eventuel faglig lederrolle, telefon og e-mail.`,`Siden bruger ikke niveau 2-skabelonen, fordi den er et opslagsværk og ikke en fortælling.`,`statement → filtrér på arbejdsområde → find medarbejderen → kontakt`],
 np:[`Samme skabelon som de andre undersider under Om os, her med Nyheder og presse.`,`De fleste kommer for nyhederne, så det seneste nyt kommer højt. Journalister får en kompakt pressekasse lige efter introen.`,`Medaljetallet for 2026 følger lige efter nyhederne, fordi resultater er den næsthyppigste grund til at komme. Derefter kommer emnerne og de seneste udgivelser.`,`Til sidst får man svar på de mest almindelige spørgsmål og finder alle pressekontakter.`,`bag hver medalje er der en historie → sådan hjælper vi → er du journalist? → seneste nyt → medaljer → emnerne → udgivelser → spørgsmål og svar → pressekontakter`],

 tp:[`Samme skabelon for niveau 2 som de andre fagområder, her med Teknologi & performance.`,`Siden starter med, at resultater i eliteidræt ofte afgøres af små marginaler, og med hvad Team Danmarks eksperter i biomekanik, præstationsanalyse og teknologi hjælper med. Derefter kommer de tre fagområder.`,`Eksemplerne viser, hvordan arbejdet ser ud i praksis, og modulet om data før, under og efter konkurrencen forklarer, hvor analyserne bruges.`,`Til sidst møder man eksperterne, får svar på de mest almindelige spørgsmål og kan finde vej til fortrolig hjælp gennem Elitesupport.`,`hvorfor det betyder noget → hvad vi hjælper med → fagområderne → eksempler → data før, under og efter → teknologi i hverdagen → eksperterne → spørgsmål og svar → hjælp`],

steps:[[`Råd 1`,`Vær en god rollemodel`,`Dit barn lægger mærke til, hvordan du opfører dig til træning, til stævner og i klubben.`],[`Råd 2`,`Find balancen i din støtte`,`Giv praktisk og følelsesmæssig støtte, men vær ikke med til alt, og lad barnet tage ansvar.`],[`Råd 3`,`Bak op om talentmiljøet`,`Giv en hånd med i klubben, vis trænerne anerkendelse, og vær med til at skabe en god tone.`],[`Råd 4`,`Hold fokus på trivsel`,`Sørg for, at alle omkring dit barn har fokus på, at det trives.`],[`Råd 5`,`Styrk glæden ved sporten`,`Hjælp dit barn med at finde glæden ved sporten og med at sætte langsigtede mål.`],[`Råd 6`,`Støt motivationen`,`Find ud af, hvad der driver dit barn, og hjælp motivationen med at handle om læring og udvikling.`],[`Råd 7`,`Ros indsats og udvikling`,`Fokusér på færdigheder og procesmål frem for resultater.`],[`Råd 8`,`Se bredere på sporten`,`Fremhæv venskaber, fællesskab og personlig udvikling, og hjælp barnet med at bruge det i skolen og fritiden.`],[`Råd 9`,`Giv feedback, der udvikler`,`Tag udgangspunkt i barnets egen udvikling frem for sammenligninger, og stil åbne spørgsmål.`]],

qs:[[`Hvordan kan jeg støtte mit barn bedst?`,`Giv både praktisk og følelsesmæssig støtte, men lad barnet selv tage ansvar. Forældreguiden giver dig redskaber til forskellige situationer.`,`Se forældreguiden`,`Forældreguide`],[`Skal jeg være med til al træning?`,`Nej. Det er godt at vise interesse, men dit barn skal også have plads til at tage ansvar og stå på egne ben.`,`Se de gode råd`,`Gode råd til sportsforældre`],[`Hvordan giver jeg god feedback efter en konkurrence?`,`Tag udgangspunkt i dit barns egen udvikling frem for at sammenligne med andre, ros indsatsen, og stil åbne spørgsmål, der får barnet til at reflektere.`,`Se de gode råd`,`Gode råd til sportsforældre`],[`Hvad er talentklasser?`,`Særlige klasser for elever i 7.-9. klasse på udvalgte skoler i Team Danmarks Elitekommuner. Eleverne træner 2-3 gange om ugen, typisk som morgentræning i skoletiden.`,`Læs om talentklasser`,`Talentklasser`],[`Hvordan bruger jeg forældreguiden?`,`Læs guiden, før du deltager i en workshop. Den er bygget op om ti temaer, fx motivation, feedback, trivsel og den sammenhængende hverdag.`,`Se forældreguiden`,`Forældreguide`],[`Må vi bruge materialet i vores klub?`,`Ja, så længe I krediterer Team Danmark og Kolding Talent og ikke bruger materialet kommercielt.`,`Se materialerne`,`Undervisningsmateriale`]],

qs:[[`Hvad er ATK 2.0?`,`Team Danmarks anbefalinger til træning af børn og unge før, under og efter puberteten. Bogen dækker fysisk og motorisk træning, sportsmedicin, sportsernæring, sportspsykologi, sportspædagogik og atletuddannelse.`,`Læs om ATK 2.0`,`ATK 2.0`],[`Hvordan får jeg fat i ATK 2.0?`,`Du kan læse bogen online, downloade den som pdf eller bestille den trykte udgave til 299 kr.`,`Læs om ATK 2.0`,`ATK 2.0`],[`Hvad er TalentHUSET?`,`Et fælles værdisæt for talentudvikling i dansk idræt, udviklet af Team Danmark og DIF. Det bygger på fem værdier: helhed, udvikling, samarbejde, engagement og trivsel.`,`Læs om TalentHUSET`,`TalentHUSET`],[`Må jeg undervise i Life Skills?`,`Ja, hvis du har deltaget i Team Danmarks Life Skills-kursus. Materialet må ikke bruges kommercielt, og brugen kræver godkendelse fra Team Danmark.`,`Læs om Life Skills`,`Life Skills`],[`Hvilken uddannelse skal trænere i talentklasserne have?`,`DIF Træner 2, DIF Diplomtræneruddannelsen eller anden uddannelse eller erfaring, der kvalificerer til at træne talenter.`,`Læs om talentklasser`,`Talentklasser`],[`Hvem kan deltage i Team Danmarks kompetenceudvikling?`,`Tilbuddene er primært til landstrænere og sportschefer i de forbund, Team Danmark støtter, fx Landstræneruddannelsen.`,`Læs om kompetenceudvikling`,`Kompetenceudvikling`]],

qs:[[`Hvad er en Elitekommune?`,`En kommune, som Team Danmark samarbejder med om at udvikle lokale talentmiljøer. Kommunen samarbejder med skoler, klubber og uddannelser, så talenterne kan kombinere sport og uddannelse.`,`Læs om Elitekommuner`,`Elitekommuner`],[`Hvor mange Elitekommuner er der?`,`Der er 24 Elitekommuner fordelt over hele landet. Hver kommune prioriterer udvalgte idrætsgrene, som er godkendt af specialforbundene.`,`Se oversigten`,`Oversigt over Elitekommuner`],[`Hvordan bliver vores kommune Elitekommune?`,`Team Danmark indgår 4-årige samarbejdsaftaler med kommuner, der lever op til kravene om økonomi, organisering og prioriterede sportslige miljøer.`,`Læs om Elitekommuner`,`Elitekommuner`],[`Kan vi få rådgivning, selvom vi ikke er Elitekommune?`,`Ja. Team Danmark rådgiver alle interesserede kommuner og kan også støtte lokale udviklingsprojekter sammen med specialforbundene.`,`Læs om Elitekommuner`,`Elitekommuner`],[`Hvilke forbund støtter Team Danmark?`,`Støttekonceptet har tre kategorier: verdensklasseforbund, eliteforbund og innovationsstøttede forbund.`,`Læs om støttekonceptet`,`Støttekoncept`],[`Hvad er en masterplan?`,`En plan, som forbundet hvert år laver sammen med Team Danmark. Den indeholder resultatmål, strategiske prioriteringer, Team Danmarks ekspertressourcer og et fælles elitebudget.`,`Læs om støttekonceptet`,`Støttekoncept`]],

toolsH:`Rammerne for vores arbejde`,
tools:[[`Hvorfor vi findes`,`Team Danmark er oprettet ved Lov om eliteidræt fra 1984 og har ansvaret for dansk eliteidræt. Loven fastsætter vores opgaver, fx talentudvikling, økonomisk støtte til atleter og forskning, og forpligter os til at udvikle eliteidrætten på en socialt og samfundsmæssigt forsvarlig måde. Vi arbejder tæt sammen med Danmarks Idrætsforbund, specialforbundene og kommunerne, og kulturministeren og DIF udpeger hver halvdelen af vores bestyrelse.`,`Læs om ansvarlig eliteidræt`,``,`data-act="sub" data-a="3" data-t="Ansvarlig eliteidræt"`],[`Det forventer staten af os`,`Rammeaftalen med Kulturministeriet fastlægger målene for Team Danmarks arbejde i aftaleperioden.`,`Download pdf`,``],[`Sådan prioriterer vi`,`Vores strategi og støttekoncept, Næste niveau, beskriver vores prioriteter for 2025-2028, og hvordan vi samarbejder med forbundene.`,`Download pdf`,`Strategi og støttekoncept`],[`Årsberetning`,`Årsberetningen samler årets resultater og indsatser. I 2024 var 1.215 atleter kategoriseret, og vi havde 56 uddannelsespartnere på ungdomsuddannelserne.`,`Download pdf`,``]],

qs:[[`Hvordan er Team Danmark finansieret?`,`Team Danmark er finansieret af staten, primært gennem udlodningsmidlerne og finansloven. Derudover kommer der indtægter fra kommercielle samarbejder gennem DIF og Team Danmark Kommerciel.`,``,``],[`Hvad er Team Danmark?`,`En offentlig selvejende institution, der skal udvikle dansk eliteidræt på en socialt og samfundsmæssigt forsvarlig måde. Opgaverne er fastsat i Lov om eliteidræt.`,`Læs om vision og mission`,`Vision og mission`],[`Hvem bestemmer over Team Danmark?`,`Bestyrelsen er det øverste organ. Den har otte medlemmer. Fire udpeges af kulturministeren, herunder formanden, og fire af Danmarks Idrætsforbund.`,`Se bestyrelsen`,`Organisation og bestyrelse`],[`Hvilke sportsgrene støtter Team Danmark?`,`Ifølge loven prioriterer Team Danmark sportsgrene med tradition for højt internationalt niveau, og hvor der kan laves et troværdigt og langsigtet talentarbejde.`,`Læs om støttekonceptet`,`Strategi og støttekoncept`],[`Hvad betyder Mennesker og medaljer?`,`At vejen til medaljer går gennem et arbejde med det hele menneske gennem hele karrieren. Derfor støtter vi også uddannelse, trivsel og livet uden for sporten.`,`Læs om vision og mission`,`Vision og mission`],[`Hvor mange atleter støtter Team Danmark?`,`I 2024 var 1.215 atleter kategoriseret af Team Danmark.`,``,``],[`Hvornår blev Team Danmark grundlagt?`,`Den første lov om eliteidræt blev underskrevet 19. december 1984, og Team Danmark fejrede 40-års jubilæum i 2024.`,``,``]],

qs:[[`Hvor kan jeg sige fra, hvis noget er galt?`,`Indplacerede atleter og trænere kan indberette uacceptabel adfærd til EliteSupport. Henvendelserne behandles af Anti Doping Danmark, så de bliver behandlet uafhængigt af Team Danmark og forbundene.`,`Gå til EliteSupport`,``,`data-act="sub" data-a="0" data-t="Få hjælp og rådgivning"`],[`Hvem har lavet det etiske kodeks?`,`Team Danmark og Danmarks Idrætsforbund har lavet det sammen. Det gælder for dansk konkurrenceidræt, herunder eliteidrætten, og blev senest revideret i 2022.`,`Læs om etisk kodeks`,`Etisk kodeks`],[`Må jeg spille på min egen sport?`,`Spil på egne kampe og misbrug af intern viden er forbudt. Har du kendskab til eller mistanke om matchfixing, skal du indberette det til Spillemyndigheden.`,`Læs om spillekultur`,`Sport og spillekultur`],[`Hvordan tjekker jeg, om min medicin er tilladt?`,`Brug Anti Doping Danmarks medicin-app. Den viser, om medicinen er tilladt eller forbudt efter dopinglisten.`,`Læs om antidoping`,`Antidoping`],[`Hvem står for dopingkontrollen?`,`Anti Doping Danmark, som er et uafhængigt agentur mellem Kulturministeriet og idrættens organisationer.`,`Læs om antidoping`,`Antidoping`],[`Hvordan fører Team Danmark tilsyn med forbundene?`,`Gennem masterplanen og samarbejdsaftalen, løbende opfølgning, tilstedeværelse i elitemiljøerne og årlige undersøgelser blandt atleterne.`,`Se tilsynsproceduren`,`Tilsynsprocedure`]],

const FU={key:`fu`,title:`Forskning og udvikling`,sec:3,l3:true,storiesEarly:true,
statement:`Forskning gør os klogere på, hvad der skaber verdensklasse.`,
introH:`Sådan bruger vi forskning`,
introP:`Team Danmark samarbejder med danske forskningsmiljøer om ny viden, der kan bruges i træning og konkurrence. Vi vil styrke idrætsforskningen i Danmark og skabe en tæt dialog mellem forskere og dem, der arbejder med atleterne til daglig.`,
topicsH:`Find viden om forskning og udvikling`,
topics:[[`Resultater og viden`,`Nye resultater og publikationer.`],[`Forskningsstøtte og ansøgning`,`Sådan søger du støtte til et projekt.`],[`Forskningsnetværk og samarbejdspartnere`,`De forskningsmiljøer, vi samarbejder med.`],[`Nationalt elitesportscenter`,`Et nationalt forskningsprogram for eliteidræt.`]],

tools:[[`Krop og fysisk træning`,`Fx hvordan træning, restitution og højde påvirker præstationen. Netværket PRoKIT undersøger præstation og restitution i intervalidræt som håndbold, fodbold og ishockey.`,`Gå til Krop & fysisk træning`,``,`data-act="sub" data-a="1" data-t="Krop & fysisk træning"`],[`Kost og ernæring`,`Fx hvordan lavt energiindtag påvirker kvindelige atleter, og hvordan musklerne lagrer kulhydrat. Resultaterne bliver til konkrete kostråd.`,`Gå til Kost & ernæring`,``,`data-act="sub" data-a="1" data-t="Kost & ernæring"`],[`Mental sundhed og trivsel`,`Fx atleternes trivsel, som måles hvert år i Team Danmarks trivselsundersøgelse, og risikoen for spiseforstyrrelser i idrætten.`,`Gå til Mental træning & trivsel`,``,`data-act="sub" data-a="1" data-t="Mental træning & trivsel"`],[`Skader og sportsmedicin`,`Fx hvordan skader kan forebygges, og hvordan atleterne kommer bedst tilbage efter en skade.`,`Gå til Skader & behandling`,``,`data-act="sub" data-a="1" data-t="Skader & behandling"`],[`Teknologi og præstationsanalyse`,`Fx biomekanik, aerodynamik og analyse af data og video fra træning og konkurrence.`,`Gå til Teknologi & performance`,``,`data-act="sub" data-a="1" data-t="Teknologi & performance"`]],
journey:[`Et højdehotel til danske atleter`,`Med 100 mio. kr. fra Novo Nordisk Fonden har Team Danmark etableret et nationalt elitesportscenter. Halvdelen af pengene går til et forskningsprogram, og den anden halvdel går til faciliteter som et højdehotel og et klimakammer, hvor atleterne kan træne under forhold, de møder i konkurrencer verden over.`,`Læs om elitesportscentret`,`Nationalt elitesportscenter`],

qs:[[`Hvem kan søge forskningsstøtte?`,`Forskere og forskningsmiljøer kan søge, gerne i samarbejde med eksperter, trænere eller forbund. Kriterierne står under Forskningsstøtte og ansøgning.`,`Læs om ansøgning`,`Forskningsstøtte og ansøgning`],[`Hvilke typer støtte kan man søge?`,`Der kan søges støtte til forskningsnetværk, afgrænsede projekter og mindre seedprojekter med nye idéer.`,`Læs om ansøgning`,`Forskningsstøtte og ansøgning`],[`Hvornår er der ansøgningsfrist?`,`Fristerne bliver offentliggjort under Forskningsstøtte og ansøgning, når der er åbne opslag.`,`Læs om ansøgning`,`Forskningsstøtte og ansøgning`],[`Kan trænere og forbund foreslå et projekt?`,`Ja. Idéer fra praksis er vigtige for, at forskningen svarer på de spørgsmål, eliteidrætten har. Kontakt vores forskningsadministrator.`,``,``],[`Hvad er det nationale elitesportscenter?`,`Et nationalt forskningsprogram for eliteidræt, som Team Danmark har etableret med støtte fra Novo Nordisk Fonden.`,`Læs om elitesportscentret`,`Nationalt elitesportscenter`],[`Hvor kan jeg finde resultaterne?`,`Under Resultater og viden samler vi nye resultater, rapporter og artikler fra vores forskningsprojekter.`,`Se resultater og viden`,`Resultater og viden`]],

  else if(act==='staff-open')staffOpen(a);
  else if(act==='staff-close')staffClose();
  else if(act==='acc')toggleAcc(a);else if(act==='faq'){const items=[...document.querySelectorAll('.ta-faq-item')];items.forEach((it,i)=>{const b=it.firstElementChild,pn=it.children[1];const open=i===a&&b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));pn.hidden=!open;});}
  else if(act==='mgroup'){st.n=st.n===a?null:a;updateOverlays();}
});
function openPacc(k){const box=document.getElementById('ta-pacc');if(!box)return;[...box.children].forEach((it,i)=>{it.firstElementChild.setAttribute('aria-expanded',String(i===k));it.children[1].hidden=i!==k;});}
app.addEventListener('mouseover',ev=>{if(!window.matchMedia('(hover:hover)').matches)return;const it=ev.target.closest('#ta-pacc>.ta-acc-item');if(!it)return;const k=[...it.parentNode.children].indexOf(it);if(it.firstElementChild.getAttribute('aria-expanded')!=='true')openPacc(k);});
app.addEventListener('input',ev=>{if(ev.target&&ev.target.id==='st-q'){staffQ=ev.target.value;staffRefresh();}});
app.addEventListener('submit',ev=>ev.preventDefault());
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;staffClose();document.querySelectorAll('.annot-card:not([hidden])').forEach(c=>{c.hidden=true;const d=c.parentElement.querySelector('.annot-dot');d.setAttribute('aria-expanded','false');d.focus();});});
app.addEventListener('mouseover',ev=>{const b=ev.target.closest('[data-act="expert"]');if(b&&!b.classList.contains('is-active'))setExpert(Number(b.dataset.a));const ac=ev.target.closest('[data-act="acc"]');if(ac)toggleAcc(Number(ac.dataset.a));});
navButtons.forEach((b,i)=>{
  b.addEventListener('mouseenter',()=>setMega(i));
  b.addEventListener('focus',()=>setMega(i));
});
hdr.addEventListener('mouseleave',()=>setMega(null));

let ticking=false;
document.addEventListener('scroll',ev=>{const t=ev.target;if(!t||!t.id||(t.id!=='fp-track'&&t.id!=='ta-track'))return;const k=t.id==='fp-track'?'fp':'ta';const pv=document.querySelector(`[data-act="${k}-prev"]`),nx=document.querySelector(`[data-act="${k}-next"]`);if(pv)pv.classList.toggle('is-muted',t.scrollLeft<4);if(nx)nx.classList.toggle('is-muted',t.scrollLeft+t.clientWidth>=t.scrollWidth-4);},true);
window.addEventListener('scroll',()=>{
  if(ticking)return;
  ticking=true;
  window.requestAnimationFrame(()=>{
    ticking=false;
    if(st.e===null){ if(st.d){st.d=false;applyHidden();} lastY=window.scrollY; return; }
    const y=window.scrollY, diff=y-lastY;
    let d=st.d;
    if(y<120)d=false; else if(Math.abs(diff)>8)d=diff>0;
    lastY=y;
    if(d!==st.d){st.d=d;applyHidden();}
  });
},{passive:true});

renderAll();
</script>
